<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>clarifin prototype</title>
    <style>
:root {
  color-scheme: light;
  --bg-app: #fafbfc;
  --text-main: #111827;
  --text-muted: #7D828A;
  --text-light: #BCC2CA;
  --green-bg: rgba(16, 185, 129, 0.12);
  --green-text: #059669;
  --red-bg: rgba(239, 68, 68, 0.12);
  --red-text: #dc2626;
  --gray-bg: rgba(107, 114, 128, 0.12);
  --gray-text: #7e899a;
  --yellow-bg: rgba(245, 158, 11, 0.15);
  --yellow-text: #b45309;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-weight: 700; }

body { margin: 0; height: 100vh; overflow: hidden; background: #f1f3f6; color: var(--text-main); }

button { border: 0; font: inherit; background: none; padding: 0; cursor: pointer; }

.phone-shell {
  width: min(100%, 414px);
  height: 100vh; 
  margin: 0 auto;
  background: var(--bg-app);
  position: relative; 
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.12);
}

.app-screen { padding: 96px 16px 110px 16px; height: 100%; overflow-y: auto; }

.screen[hidden] { display: none; }

.liquid-glass {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.1) 100%);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-top: 1px solid rgba(255, 255, 255, 0.85); 
  border-left: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.8), inset 0 -2px 6px rgba(0, 0, 0, 0.03), 0 12px 32px rgba(0, 0, 0, 0.08); 
}

.top-nav {
  position: absolute; top: 16px; left: 16px; right: 16px; height: 56px;
  border-radius: 99px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-4) 0 var(--sp-5); z-index: 100;
}

.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
.next-event { position: absolute; left: 50%; transform: translateX(-50%); color: var(--text-muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
.avatar { width: 32px; height: 32px; background: var(--text-main); color: #fff; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; }

.greeting-section { margin-bottom: var(--sp-6); padding-top: var(--sp-2); }
.date-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 var(--sp-1) 0; }
.greeting-section h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 var(--sp-1) 0; }

.tabs-container { display: inline-flex; background: rgba(0, 0, 0, 0.04); padding: 4px; border-radius: 99px; margin-bottom: var(--sp-4); }
.event-tab { padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--text-muted); transition: all 0.2s ease; }
.event-tab.active { background: #fff; color: var(--text-main); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); }
.event-tab[data-event-mode="upcoming"] { color: var(--text-muted); }

.dot { display: inline-block; width: 6px; height: 6px; background: var(--red-text); border-radius: 50%; margin-left: 4px; vertical-align: 2px; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

.event-list { display: flex; flex-direction: column; gap: var(--sp-4); }

.event-card {
  border-radius: 24px; padding: var(--sp-5); text-align: left; position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease; display: block; width: 100%;
}
.event-card.upcoming-card { padding-bottom: 44px; }
.event-card.liquid-glass, .detail-hero.liquid-glass, .detail-card.liquid-glass { box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.72), inset 0 -1px 4px rgba(0, 0, 0, 0.02), 0 7px 20px rgba(0, 0, 0, 0.045); }
.event-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08); }
.event-card:active { transform: scale(0.98); }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
.category-pill { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--sp-2); }

.region-flag {
  width: 24px; height: 24px; border-radius: 50%; object-fit: contain;
  background: transparent; flex-shrink: 0; margin-left: 8px;
}

.event-card h2 { font-size: 18px; font-weight: 700; line-height: 1.25; margin: 0 0 var(--sp-2) 0; letter-spacing: -0.3px; }
.event-card p { font-size: 14px; color: var(--text-light); line-height: 1.4; margin: 0 0 var(--sp-4) 0; }

.card-meta { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.score-pill { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; background: var(--yellow-bg); color: var(--yellow-text); }
.score-pill.gray { background: var(--gray-bg); color: var(--gray-text); }

.ticker-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-right: 40px; }
.ticker-chip { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
.ticker-chip.positive { background: var(--green-bg); color: var(--green-text); }
.ticker-chip.negative { background: var(--red-bg); color: var(--red-text); }
.ticker-chip.mixed, .ticker-chip.neutral { background: var(--gray-bg); color: var(--gray-text); }

.timestamp { position: absolute; bottom: 20px; right: 16px; font-size: 11px; font-weight: 700; color: var(--text-light); }
.upcoming-card .timestamp { right: 20px; bottom: 18px; }

.detail-controls { display: flex; justify-content: space-between; margin-bottom: var(--sp-4); }
.action-btn { padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.8); }
.action-btn.saved { background: var(--yellow-bg); color: var(--yellow-text); border-color: transparent; }

.detail-hero { border-radius: 24px; padding: var(--sp-5); margin-bottom: var(--sp-3); }
.detail-hero h1 { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 0 0 var(--sp-3) 0; letter-spacing: -0.5px; }
.detail-summary { font-size: 14px; color: var(--text-light); line-height: 1.5; margin: 0 0 var(--sp-4) 0; }
.signal-row { display: flex; gap: var(--sp-2); }

.detail-sections { display: flex; flex-direction: column; gap: var(--sp-3); }
.detail-card { border-radius: 24px; }
details.detail-card summary { padding: var(--sp-5); font-size: 16px; font-weight: 700; color: var(--text-main); list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.detail-card summary::-webkit-details-marker { display: none; }
details.detail-card summary::after { content: "+"; font-size: 18px; font-weight: 700; color: var(--text-muted); }
details.detail-card[open] summary::after { content: "−"; }

.detail-body { padding: 0 var(--sp-5) var(--sp-5) var(--sp-5); font-size: 14px; line-height: 1.5; color: var(--text-muted); font-weight: 400; }
.detail-body p, .detail-body li { font-family: inherit; font-size: 14px; line-height: 1.5; color: var(--text-muted); font-weight: 400; }

.chain-list, .asset-list, .scenario-list, .counter-list, .source-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.chain-step strong, .scenario-item strong { display: block; color: var(--text-main); margin-bottom: 4px; font-size: 15px; font-weight: 700; }
.chain-step p, .scenario-item p { margin: 0 0 6px 0; }

.asset-card { background: rgba(0, 0, 0, 0.03); padding: var(--sp-3); border-radius: 12px; }
.asset-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
.asset-top h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-main); }
.asset-top span { font-size: 12px; font-weight: 700; text-transform: capitalize; }
.direction-positive { color: var(--green-text); }
.direction-negative { color: var(--red-text); }
.direction-mixed, .direction-neutral { color: var(--gray-text); }
.asset-card p { margin: 4px 0 0 0; font-size: 13px; }

.bottom-nav { position: absolute; bottom: 24px; left: 16px; right: 16px; height: 64px; border-radius: 99px; display: flex; justify-content: space-around; align-items: center; padding: 0 var(--sp-2); z-index: 100; }
.bottom-nav[hidden] { display: none; }
.nav-item { flex: 1; text-align: center; padding: 12px 0; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--text-muted); transition: all 0.2s ease; }
.nav-item.active { background: var(--text-main); color: #fff; }
.disclaimer { text-align: center; font-size: 10px; font-weight: 400; color: var(--text-muted); margin-top: var(--sp-6); padding: 0 var(--sp-4); }

    </style>
  </head>
  <body>
    <div class="phone-shell">
      
      <header class="top-nav liquid-glass">
        <div class="brand">clarifin</div>
        <div class="next-event">NEXT: FOMC in 4h</div>
        <div class="avatar">L</div>
      </header>

      <main class="app-screen">
        <section class="screen list-screen" id="list-screen">
          <section class="greeting-section" id="screen-intro">
            <p class="date-label">Wednesday, 21 May</p>
            <h1>Good morning, Luca</h1>
          </section>

          <section class="feed-section">
            <div class="tabs-container" id="event-tabs">
              <button class="event-tab active" data-event-mode="top" type="button">
                Top Events <span class="dot"></span>
              </button>
              <button class="event-tab" data-event-mode="upcoming" type="button">Upcoming</button>
            </div>
            
            <div class="event-list" id="event-list"></div>
            
            <p class="disclaimer">Not investment advice. No buy/sell recommendations or performance promises.</p>
          </section>
        </section>

        <section class="screen detail-screen" id="detail-screen" hidden>
          <div class="detail-controls">
            <button class="action-btn liquid-glass" id="back-button" type="button">← Back</button>
            <button class="action-btn liquid-glass" id="save-node" type="button">Save</button>
          </div>

          <article class="detail-hero liquid-glass">
            <p class="category-pill" id="node-category">Node</p>
            <h1 id="node-title">Select a node</h1>
            <p class="detail-summary" id="node-summary"></p>
            <div class="signal-row">
              <span class="score-pill yellow" id="impact-label"></span>
              <span class="score-pill gray" id="confidence-label"></span>
            </div>
          </article>

          <div class="detail-sections" id="detail-sections"></div>
        </section>
      </main>

      <nav class="bottom-nav liquid-glass" aria-label="Primary navigation">
        <button class="nav-item active" data-view="home" type="button">Home</button>
        <button class="nav-item" data-view="watchlist" type="button">Watchlist</button>
        <button class="nav-item" data-view="saved" type="button">Saved</button>
      </nav>
      
    </div>

const nodes = [
  {

      { ticker: "LVMH", name: "LVMH Moet Hennessy Louis Vuitton", direction: "negative", strength: "Medium", reason: "Middle East demand, tourism flows and stagflation pressure can weigh on luxury spending." },
      { ticker: "RHM", name: "Rheinmetall", direction: "positive", strength: "Medium", reason: "Geopolitical escalation can increase attention on defence budgets and order visibility." },
      { ticker: "XOM", name: "Exxon Mobil", direction: "positive", strength: "High", reason: "Non-Gulf oil production may become more valuable if disruption lifts realized crude prices." }

  {

    impact: 74,
    impactLabel: "High",
    confidence: 68,
    confidenceLabel: "Medium-high",
    timestamp: "2 h",
    whyMatters: "A longer pause changes discount rates, funding costs and risk appetite. The effect is not uniform: banks, real estate, consumers and long-duration growth stocks react through different mechanisms.",

    counterarguments: [

      "Bank margin benefits can be offset by rising credit losses or higher deposit costs.",

    sources: ["ECB Statements", "Eurostat", "Bundesbank", "Company Filings"]
  },
  {

    short: "The AI capex cycle extends from GPUs to power, cooling, memory and cloud margins.",
    impact: 81,
    impactLabel: "High",
    confidence: 71,
    confidenceLabel: "High",
    timestamp: "4 h",
    whyMatters: "AI capex connects chips, memory, networking, data centers, power and cloud economics. The market question is not only who sells more infrastructure, but who can justify rising investment through utilization and margin expansion.",
    chains: [
      { title: "Chips and networking", event: "Big Tech lifts AI infrastructure budgets.", mechanism: "GPU clusters require accelerators, HBM, advanced packaging and high-performance networking.", sectorImpact: "Supply constraints can move along the value chain rather than disappearing at the GPU level.", assetImpact: "Nvidia, Broadcom, Micron and ASML screen as direct infrastructure beneficiaries.", watch: "HBM supply, advanced packaging capacity, lead times and order concentration." },

const upcomingEvents = [
  { date: "TOMORROW, 14:30", category: "Macro", title: "US CPI release", short: "Inflation data could reset rate-cut expectations.", watch: ["S&P 500", "Nasdaq", "Dollar", "Bonds"] },
  { date: "TUESDAY, 22:00", category: "Earnings", title: "NVIDIA earnings", short: "AI demand, margins and supply constraints move back into focus.", watch: ["NVDA", "AMD", "Semiconductors", "Cloud"] },
  { date: "WEDNESDAY, 20:00", category: "Central Banks", title: "Fed decision", short: "Policy language may shift yields, banks and risk assets.", watch: ["S&P 500", "Treasuries", "Dollar", "Banks"] }
];

const watchlist = ["TSMC", "Apple", "Rheinmetall", "LVMH", "Microsoft", "Vonovia"];
const directionOrder = { positive: 0, negative: 1, mixed: 2, neutral: 2 };
let activeView = "home";
let eventMode = "top";
let selectedNodeId = null;
let savedNodeIds = JSON.parse(localStorage.getItem("clarifinSavedNodes") || "[]");

const listScreen = document.querySelector("#list-screen");
const detailScreen = document.querySelector("#detail-screen");
const screenIntro = document.querySelector("#screen-intro");
const eventTabs = document.querySelector("#event-tabs");
const eventList = document.querySelector("#event-list");
const detailSections = document.querySelector("#detail-sections");
const saveButton = document.querySelector("#save-node");
const bottomNav = document.querySelector(".bottom-nav");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getNode(id) {
  return nodes.find((node) => node.id === id);
}

function getTickers(node) {
  return node.affectedAssets
    .slice()
    .sort((a, b) => directionOrder[a.direction] - directionOrder[b.direction])
    .slice(0, 4)
    .map((asset) => ({ ticker: asset.ticker, direction: asset.direction }));
}

function getWatchlistHits(node) {
  const text = JSON.stringify(node).toLowerCase();
  return watchlist.filter((item) => text.includes(item.toLowerCase()));
}

function renderIntro() {
  if (activeView === "home") {
    screenIntro.innerHTML = `
      <p class="date-label">Wednesday, 21 May</p>
      <h1>Good morning, Luca</h1>
    `;
    eventTabs.hidden = false;
  } else if (activeView === "watchlist") {
    screenIntro.innerHTML = `
      <p class="date-label">Watchlist</p>
      <h1>Relevant nodes</h1>
    `;
    eventTabs.hidden = true;
  } else {
    screenIntro.innerHTML = `
      <p class="date-label">Saved</p>
      <h1>Saved nodes</h1>
    `;
    eventTabs.hidden = true;
  }

function renderNodeCards(list) {
  if (!list.length) {
    eventList.innerHTML = `<article class="event-card liquid-glass"><p>No nodes here yet.</p></article>`;
    return;
  }

  eventList.innerHTML = list
    .map(
      (node) => `
        <button class="event-card liquid-glass" data-node="${node.id}" type="button">
          <div class="card-header">
            <span class="category-pill">${escapeHtml(node.category)}</span>
            <img src="${getRegionFlag(node.id)}" class="region-flag" alt="Region" onerror="this.style.display='none'" />
          </div>
          <h2>${escapeHtml(node.title)}</h2>
          <p>${escapeHtml(node.short)}</p>
          <div class="card-meta">
            <span class="score-pill yellow">${node.impact}</span>
            <span class="score-pill gray">${node.confidence}</span>
          </div>
          <div class="ticker-row">
            ${getTickers(node).map((asset) => `<span class="ticker-chip ${asset.direction}">${escapeHtml(asset.ticker)}</span>`).join("")}
          </div>
          <span class="timestamp">${escapeHtml(node.timestamp)}</span>
        </button>
      `
    )
    .join("");
}

function renderUpcomingCards() {
  eventList.innerHTML = upcomingEvents
    .map(
      (event) => `
        <article class="event-card upcoming-card liquid-glass">
          <div class="card-header">
            <span class="category-pill">${escapeHtml(event.category)}</span>
            <img src="${getUpcomingFlag(event.title)}" class="region-flag" alt="Region" onerror="this.style.display='none'" />
          </div>
          <h2>${escapeHtml(event.title)}</h2>
          <p>${escapeHtml(event.short)}</p>
          <div class="ticker-row">
            ${event.watch.map((item) => `<span class="ticker-chip neutral">${escapeHtml(item)}</span>`).join("")}
          </div>
          <span class="timestamp">${escapeHtml(event.date)}</span>
        </article>
      `
    )
    .join("");
}

function renderList() {
  selectedNodeId = null;
  listScreen.hidden = false;
  detailScreen.hidden = true;
  bottomNav.hidden = false;
  window.scrollTo(0, 0);
  renderIntro();

  document.querySelectorAll(".event-tab").forEach((tab) => {
    tab.classList.toggle("active", tab.dataset.eventMode === eventMode);
  });

  if (activeView === "watchlist") {
    renderNodeCards(nodes.filter((node) => getWatchlistHits(node).length));
  } else if (activeView === "saved") {
    renderNodeCards(nodes.filter((node) => savedNodeIds.includes(node.id)));
  } else if (eventMode === "upcoming") {
    renderUpcomingCards();
  } else {
    renderNodeCards(nodes);
  }
}

function section(title, body, open = false) {
  return `
    <details class="detail-card liquid-glass" ${open ? "open" : ""}>
      <summary>${escapeHtml(title)}</summary>
      <div class="detail-body">${body}</div>
    </details>
  `;
}

function renderDetail(node) {
  selectedNodeId = node.id;
  listScreen.hidden = true;
  detailScreen.hidden = false;
  bottomNav.hidden = true;
  window.scrollTo(0, 0);
  
  document.querySelector("#node-category").textContent = node.category;
  document.querySelector("#node-title").textContent = node.title;
  document.querySelector("#node-summary").textContent = node.short;
  
  document.querySelector("#impact-label").textContent = `Impact ${node.impact} / ${node.impactLabel}`;
  document.querySelector("#confidence-label").textContent = `Confidence ${node.confidence} / ${node.confidenceLabel}`;

  const isSaved = savedNodeIds.includes(node.id);
  saveButton.textContent = isSaved ? "Saved" : "Save";
  saveButton.classList.toggle("saved", isSaved);

  const chainsHTML = `<ul class="chain-list">${node.chains.map(c => `<li class="chain-step"><strong>${escapeHtml(c.title)}</strong><p>Event: ${escapeHtml(c.event)}</p><p>Impact: ${escapeHtml(c.sectorImpact)}</p></li>`).join("")}</ul>`;
  const assetsHTML = `<ul class="asset-list">${node.affectedAssets.map(a => `<li class="asset-card"><div class="asset-top"><h3>${escapeHtml(a.ticker)}</h3><span class="direction-${a.direction}">${escapeHtml(a.direction)}</span></div><p>${escapeHtml(a.reason)}</p></li>`).join("")}</ul>`;
  const scenariosHTML = `<ul class="scenario-list">${node.scenarios.map(s => `<li class="scenario-item"><strong>${escapeHtml(s.title)}:</strong><p>${escapeHtml(s.body)}</p></li>`).join("")}</ul>`;
  const countersHTML = `<ul class="counter-list">${node.counterarguments.map(c => `<li><p>${escapeHtml(c)}</p></li>`).join("")}</ul>`;

  detailSections.innerHTML = [
    section("Why it matters", `<p>${escapeHtml(node.whyMatters)}</p>`, true),
    section("Causal Chains", chainsHTML),
    section("Affected Assets", assetsHTML),
    section("Scenarios", scenariosHTML),
    section("Counterarguments", countersHTML),
    section("Sources", `<p>${node.sources.join(", ")}</p>`)
  ].join("");
}

eventList.addEventListener("click", (event) => {
  const card = event.target.closest(".event-card");
  if (!card || !card.dataset.node) return;
  renderDetail(getNode(card.dataset.node));
});

document.querySelector("#back-button").addEventListener("click", renderList);

saveButton.addEventListener("click", () => {
  if (!selectedNodeId) return;
  savedNodeIds = savedNodeIds.includes(selectedNodeId)
    ? savedNodeIds.filter((id) => id !== selectedNodeId)
    : [...savedNodeIds, selectedNodeId];
  localStorage.setItem("clarifinSavedNodes", JSON.stringify(savedNodeIds));
  renderDetail(getNode(selectedNodeId));
});

document.querySelectorAll(".event-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    eventMode = tab.dataset.eventMode;
    renderList();
  });
});

document.querySelectorAll(".nav-item").forEach((item) => {
  item.addEventListener("click", () => {
    activeView = item.dataset.view;
    eventMode = "top";
    document.querySelectorAll(".nav-item").forEach((nav) => nav.classList.toggle("active", nav === item));
    renderList();
  });
});

renderList();

    </script>
  </body>
</html>
