      <p class="profile-muted">Asset classes</p>
      ${preferenceChipsHTML(onboardingDraft.selectedAssetClasses, "No asset classes selected")}
    `
  ];
  const isFinalStep = onboardingStep === stepBodies.length - 1;
  const stepNumber = onboardingStep + 1;
  const titleId = `onboarding-step-${stepNumber}-title`;
  const descriptionId = `onboarding-step-${stepNumber}-description`;
  onboardingOverlay.hidden = false;
  onboardingOverlay.setAttribute("aria-hidden", "false");
  onboardingOverlay.innerHTML = `
    <div class="onboarding-dialog liquid-glass" role="dialog" aria-modal="true" aria-labelledby="${titleId}" aria-describedby="${descriptionId}" tabindex="-1">
      <div class="onboarding-progress">Step ${onboardingStep + 1} of ${stepBodies.length}</div>
      <div>${stepBodies[onboardingStep]}</div>
      <div class="onboarding-actions">
        <div class="screen-actions">
          ${onboardingStep > 0 ? `<button class="action-btn liquid-glass" data-onboarding-action="back" type="button">Back</button>` : ""}
          ${isFinalStep ? "" : `<button class="action-btn liquid-glass" data-onboarding-action="skip" type="button">Skip</button>`}
        </div>
        <button class="action-btn liquid-glass" data-onboarding-action="${isFinalStep ? "finish" : "next"}" type="button">${isFinalStep ? "Open Clarifin" : "Continue"}</button>
      </div>
    </div>
  `;
  focusOnboardingStep();
}

function hideOnboarding() {
  if (!onboardingOverlay) return;
  setOnboardingBackgroundInert(false);
  onboardingOverlay.hidden = true;
  onboardingOverlay.setAttribute("aria-hidden", "true");
  onboardingOverlay.innerHTML = "";
}

function closeOnboarding() {
  hideOnboarding();
  renderList();
  restoreOnboardingFocus();
}

function completeOnboarding() {
  mergeAssetSymbolsIntoWatchlist(onboardingDraft.starterSymbols);
  savePreferences({
    selectedInterests: onboardingDraft.selectedInterests,
    selectedRegions: onboardingDraft.selectedRegions,
    selectedAssetClasses: onboardingDraft.selectedAssetClasses,
    onboardingComplete: true
  });
  closeOnboarding();
}

function skipOnboarding() {
  savePreferences({ ...preferences, onboardingComplete: true });
  closeOnboarding();
}

function startOnboarding() {
  if (reviewModeEnabled) return;
  rememberOnboardingFocus();
  onboardingStep = 0;
  onboardingDraft = createOnboardingDraft(preferences);
  onboardingOptionFocusTarget = null;
  renderOnboarding();
}

function handleProfileAction(action) {
  if (action === "watchlist") {
    activeView = "watchlist";
    localScreenMessage = "";
    renderList();
  } else if (action === "saved") {
    activeView = "saved";
    localScreenMessage = "";
    renderList();
  } else if (action === "restart-onboarding") {
    startOnboarding();
  } else if (["settings", "help", "inbox"].includes(action)) {
    openLocalView(action);
  }
}

function handleAssetWatchlistToggle(reference, { restoreFocus = false, scrollTop = 0 } = {}) {
  const asset = getAssetByReference(reference);
  if (asset) {
    if (isAssetInWatchlist(asset)) {
      removeAssetFromWatchlist(asset);
      localScreenMessage = `${asset.symbol} removed from your Watchlist.`;
    } else {
      addAssetToWatchlist(asset);
      localScreenMessage = `${asset.symbol} added to your Watchlist.`;
    }
  } else {
    const normalized = normalizeWatchlistSymbol(reference);
    if (!isReferenceInWatchlist(normalized)) return;
    saveWatchlistSymbols(watchlist.filter((item) => normalizeWatchlistSymbol(item) !== normalized));
    localScreenMessage = `${normalized} removed from your Watchlist.`;
  }

  if (activeView === "asset") {
    renderAssetDetailScreen();
    announceStatus(localScreenMessage);
    appScreen.scrollTop = scrollTop;
    if (restoreFocus) {
      focusAfterRender(() => document.querySelector("[data-asset-watchlist-toggle]"), { scrollTop });
    }
  } else {
    renderDiscoverResults();
    appScreen.scrollTop = scrollTop;
    if (restoreFocus) {
      focusAfterRender(() => findDataButton("data-asset-watchlist-toggle", reference), { scrollTop });
    }
  }
}

function formatCandidateNumber(value, options = {}) {
  if (value === "" || value === null || value === undefined) return "";
  const number = Number(value);
  if (!Number.isFinite(number)) return String(value);
  return number.toLocaleString("en-US", options);
}

function renderCandidateFacts(candidate) {
  const facts = [];
  if (candidate.displayBucket) facts.push(["Bucket", formatLabel(candidate.displayBucket)]);
  if (candidate.ticker) facts.push(["Ticker", candidate.ticker]);
  if (candidate.companyName) facts.push(["Company", candidate.companyName]);
  if (candidate.earningsDate) facts.push(["Date", candidate.earningsDate]);
  if (candidate.epsEstimate !== "") facts.push(["EPS est.", formatCandidateNumber(candidate.epsEstimate, { maximumFractionDigits: 2 })]);
  if (candidate.revenueEstimate !== "") facts.push(["Revenue est.", formatCandidateNumber(candidate.revenueEstimate, { notation: "compact", maximumFractionDigits: 2 })]);
  if (candidate.sourceName) facts.push(["Source", candidate.sourceName]);
  if (candidate.marketImportanceScore) facts.push(["Market importance", Math.round(candidate.marketImportanceScore)]);
  if (!facts.length) return "";
  return `
    <div class="candidate-facts">
      ${facts.map(([label, value]) => `<span class="candidate-fact">${escapeHtml(label)} <strong>${escapeHtml(value)}</strong></span>`).join("")}
    </div>
  `;
}

function renderCandidateCards(list) {
  if (!list.length) {
    eventList.innerHTML = `<article class="event-card liquid-glass"><p>No candidates here yet.</p></article>`;
    return;
  }

  eventList.innerHTML = list.map((candidate) => {
    const canGenerate = ["candidate", "selected_for_generation", "failed"].includes(String(candidate.status || "").toLowerCase());
    const canPublish = Boolean(candidate.relatedNodeId) && String(candidate.status || "").toLowerCase() !== "published";
    return `
      <article class="event-card liquid-glass" data-candidate="${escapeHtml(candidate.id)}">
        <div class="card-header">
          <div>
            <span class="category-pill">${escapeHtml(candidate.category)}</span>
            <span class="review-badge">${escapeHtml(formatLabel(candidate.status))}</span>
          </div>
          <span class="status-pill">${escapeHtml(formatLabel(candidate.displayBucket || "top"))}</span>
        </div>
        <h2>${escapeHtml(candidate.title)}</h2>
        ${candidate.summary ? `<p>${escapeHtml(candidate.summary)}</p>` : ""}
        ${renderCandidateFacts(candidate)}
        <div class="candidate-score-grid">
          <div class="candidate-score"><span>Rel</span><strong>${Math.round(candidate.relevanceScore)}</strong></div>
          <div class="candidate-score"><span>Urg</span><strong>${Math.round(candidate.urgencyScore)}</strong></div>
          <div class="candidate-score"><span>Conf</span><strong>${Math.round(candidate.confidenceScore)}</strong></div>
          ${candidate.marketImportanceScore ? `<div class="candidate-score"><span>Mkt</span><strong>${Math.round(candidate.marketImportanceScore)}</strong></div>` : ""}
          <div class="candidate-score"><span>Total</span><strong>${Math.round(candidate.totalScore)}</strong></div>
        </div>
        ${candidate.whyItMatters ? `<p>${escapeHtml(candidate.whyItMatters)}</p>` : ""}
        ${candidate.relatedNodeId ? `<p class="review-card-note">Related node: ${escapeHtml(candidate.relatedNodeId)}</p>` : ""}
        ${candidate.autoPublishReason ? `<p class="review-card-note">Auto publish: ${escapeHtml(candidate.autoPublishReason)}</p>` : ""}
        ${candidate.autoGenerationError ? `<p class="review-card-note">Generation error: ${escapeHtml(candidate.autoGenerationError)}</p>` : ""}
        <div class="candidate-actions">
          ${canGenerate ? `<button class="action-btn liquid-glass" data-candidate-action="generate" data-candidate-id="${escapeHtml(candidate.id)}" type="button">Generate node</button>` : ""}
          ${canPublish ? `<button class="action-btn publish-action liquid-glass" data-candidate-action="publish" data-candidate-id="${escapeHtml(candidate.id)}" type="button">Publish generated</button>` : ""}
          <button class="action-btn liquid-glass" data-candidate-action="ignore" data-candidate-id="${escapeHtml(candidate.id)}" type="button">Ignore</button>
          <button class="action-btn archive-action liquid-glass" data-candidate-action="archive" data-candidate-id="${escapeHtml(candidate.id)}" type="button">Archive</button>
        </div>
      </article>
    `;
  }).join("");
}

function isEarningsEvent(event) {
  return String(event.category || "").toLowerCase() === "earnings";
}

function getPrimaryUpcomingTicker(event) {
  const watchItems = Array.isArray(event.watch) ? event.watch : [];
  const ticker = watchItems[0] || String(event.title || "").split(" ")[0];
  return String(ticker || "").trim().toUpperCase();
}

function getUpcomingEventDescription(event) {
  if (!isEarningsEvent(event)) {
    const title = String(event.title || "").toLowerCase();
    const category = String(event.category || "").toLowerCase();
    const rawShort = String(event.short || "").trim();

    if (title.includes("cpi")) {
      return "Inflation data can reset rate-cut expectations and move yields, growth stocks and the dollar. Watch headline CPI, core CPI and shelter inflation.";
    }

    if (title.includes("fed") && (title.includes("interest") || title.includes("rate") || title.includes("decision"))) {
      return "The Fed decision can shift rate expectations, bond yields, equity valuations and the dollar. Watch the statement, dot plot and Powell's press conference.";
    }

    if (title.includes("ecb") && (title.includes("interest") || title.includes("rate") || title.includes("decision"))) {
      return "The ECB decision can move European banks, real estate, bonds and EUR/USD. Watch inflation language, growth concerns and guidance on future cuts.";
    }

    if (category.includes("macro") || category.includes("central bank")) {
      return "This scheduled macro event may affect rates, currencies, equities and risk appetite depending on the outcome versus expectations.";
    }

    if (!rawShort || rawShort.toLowerCase() === "manual entry") return "Scheduled market event.";
    return rawShort;
  }

  const ticker = getPrimaryUpcomingTicker(event);
  const descriptions = {
    COST: "Costco reports earnings. Watch consumer demand, membership trends, margins and retail read-throughs.",
    ADBE: "Adobe reports earnings. Watch AI monetization, subscription growth, margins and creative software demand.",
    NKE: "Nike reports earnings. Watch China demand, inventory levels, margins and consumer spending signals.",
    FDX: "FedEx reports earnings. Watch shipping volumes, pricing, margins and global trade demand.",
    DOCU: "DocuSign reports earnings. Watch subscription growth, retention, margins and enterprise software demand.",
    CCL: "Carnival reports earnings. Watch booking trends, pricing, debt reduction and travel demand."
  };

  return descriptions[ticker] || `${ticker || "Company"} reports earnings. Watch guidance, margins, revenue growth and sector read-throughs.`;
}

function getUpcomingImportance(event) {
  const score = Number(event.importance);
  return Number.isFinite(score) && score > 0 ? Math.round(score) : null;
}

function renderUpcomingCards(events = getSortedUpcomingEvents(), options = {}) {
  const noticeHTML = options.noticeHTML || "";
  const emptyTitle = options.emptyTitle || "No upcoming events yet";
  const emptyMessage = options.emptyMessage || "Scheduled market events will appear here when available.";
  const allEvents = getSortedUpcomingEvents();
  const eventsToRender = (Array.isArray(events) ? events : [])
    .slice()
    .sort((a, b) => new Date(a.datetime).getTime() - new Date(b.datetime).getTime());
  if (!eventsToRender.length) {
    eventList.innerHTML = `
      ${noticeHTML}
      <article class="event-card liquid-glass">
        <h2>${escapeHtml(emptyTitle)}</h2>
        <p>${escapeHtml(emptyMessage)}</p>
      </article>
    `;
    return;
  }

  eventList.innerHTML = noticeHTML + eventsToRender
    .map((event) => {
      const eventIndex = allEvents.indexOf(event);
      const earnings = isEarningsEvent(event);
      const importance = earnings ? null : getUpcomingImportance(event);
      const watchItems = Array.isArray(event.watch) ? event.watch : [];

      return `
        <button class="event-card upcoming-card liquid-glass" data-upcoming-index="${eventIndex}" type="button">
          <div class="card-header">
            <span class="category-pill">${escapeHtml(event.category)}</span>
            <img src="${event.region ? getRegionFlag(event.region) : getUpcomingFlag(event.title)}" class="region-flag" alt="Region" onerror="this.style.display='none'" />
          </div>
          <h2>${escapeHtml(event.title)}</h2>
          <p>${escapeHtml(getUpcomingEventDescription(event))}</p>
          ${!earnings && importance ? `
            <div class="card-meta">
              <span class="score-pill yellow">${importance}</span>
            </div>
          ` : ""}
          ${watchItems.length ? `
            <div class="ticker-row">
              ${watchItems.map((item) => `<span class="ticker-chip neutral">${escapeHtml(item)}</span>`).join("")}
            </div>
          ` : ""}
          <span class="timestamp">${escapeHtml(formatUpcomingCardTimestamp(event.datetime))}</span>
        </button>
      `;
    })
    .join("");
}

function captureManualWatchlistInputInteraction() {
  const input = document.activeElement;
  if (input?.id !== "watchlist-symbol-input") return null;
  return {
    scrollTop: appScreen.scrollTop,
    selectionStart: input.selectionStart,
    selectionEnd: input.selectionEnd,
    selectionDirection: input.selectionDirection
  };
}

function restoreManualWatchlistInputInteraction(interaction) {
  if (!interaction || !watchlistInputVisible) return;
  const input = document.querySelector("#watchlist-symbol-input");
  if (!input) return;
  appScreen.scrollTop = interaction.scrollTop;
  input.focus({ preventScroll: true });
  if (Number.isInteger(interaction.selectionStart) && Number.isInteger(interaction.selectionEnd)) {
    const valueLength = input.value.length;
    const selectionStart = Math.min(interaction.selectionStart, valueLength);
    const selectionEnd = Math.min(interaction.selectionEnd, valueLength);
    input.setSelectionRange(selectionStart, selectionEnd, interaction.selectionDirection || "none");
  }
}

function renderList({ scrollToTop = true } = {}) {
  const manualWatchlistInteraction = captureManualWatchlistInputInteraction();
  selectedNodeId = null;
  selectedUpcomingEventId = "";
  listScreen.hidden = false;
  detailScreen.hidden = true;
  ensureBottomNavVisible();
  if (scrollToTop) scrollAppToTop();
  setActiveNav(activeView);
  renderIntro();
  updateTopHeader();

  document.querySelectorAll(".event-tab").forEach((tab) => {
    const isActiveMode = tab.dataset.eventMode === eventMode;
    tab.classList.toggle("active", isActiveMode);
    tab.setAttribute("aria-pressed", String(isActiveMode));
  });

  if (activeView === "review" && reviewLoadMessage) {
    eventList.innerHTML = `
      <article class="event-card liquid-glass">
        <h2>Draft review unavailable</h2>
        <p>${escapeHtml(reviewLoadMessage)}</p>
      </article>
    `;
    return;
  }

  const orderedNodes = sortNodesNewestFirst(getCurrentListNodes());
  const nodeNoticeHTML = renderDataStatusNotice(nodeDataState);
  const upcomingNoticeHTML = renderDataStatusNotice(upcomingDataState);

  if (activeView === "discover") {
    renderDiscoverScreen({ focusSearch: !manualWatchlistInteraction });
  } else if (activeView === "asset") {
    renderAssetDetailScreen();
  } else if (activeView === "profile") {
    renderProfileScreen();
  } else if (activeView === "settings") {
    renderSettingsScreen();
  } else if (activeView === "help") {
    renderHelpScreen();
  } else if (activeView === "inbox") {
    renderInboxScreen();
  } else if (activeView === "watchlist") {
    if (!watchlist.length) {
      renderWatchlistEmptyState(nodeNoticeHTML);
      return;
    }
    if (eventMode === "upcoming") {
      if (upcomingDataState.status === "loading" && !upcomingEvents.length) {
        eventList.innerHTML = upcomingNoticeHTML;
        return;
      }
      renderUpcomingCards(getWatchlistUpcomingEvents(), { noticeHTML: upcomingNoticeHTML });
      return;
    }
    if (nodeDataState.status === "loading" && !orderedNodes.length) {
      eventList.innerHTML = nodeNoticeHTML;
      return;
    }
    const watchlistNodes = orderedNodes.filter((node) => getWatchlistHits(node).length);
    if (!watchlistNodes.length) {
      renderWatchlistNoMatches(nodeNoticeHTML);
      return;
    }
    renderNodeCards(watchlistNodes, { noticeHTML: nodeNoticeHTML });
  } else if (activeView === "saved") {
    if (eventMode === "upcoming") {
      if (upcomingDataState.status === "loading" && !upcomingEvents.length) {
        eventList.innerHTML = upcomingNoticeHTML;
        return;
      }
      renderUpcomingCards(getSavedUpcomingEvents(), {
        noticeHTML: upcomingNoticeHTML,
        emptyTitle: "No saved upcoming events yet",
        emptyMessage: "Upcoming events you save will appear here."
      });
      return;
    }
    if (nodeDataState.status === "loading" && !orderedNodes.length) {
      eventList.innerHTML = nodeNoticeHTML;
      return;
    }
    renderNodeCards(orderedNodes.filter((node) => savedNodeIds.includes(node.id)), {
      noticeHTML: nodeNoticeHTML,
      emptyTitle: "No saved nodes yet",
      emptyMessage: "Saved nodes will appear here."
    });
  } else if (activeView === "review") {
    if (reviewTab === "candidates") renderCandidateCards(eventCandidates);
    else renderNodeCards(orderedNodes);
  } else if (eventMode === "upcoming") {
    if (upcomingDataState.status === "loading" && !upcomingEvents.length) {
      eventList.innerHTML = upcomingNoticeHTML;
      return;
    }
    renderUpcomingCards(getSortedUpcomingEvents(), { noticeHTML: upcomingNoticeHTML });
  } else {
    if (nodeDataState.status === "loading" && !orderedNodes.length) {
      eventList.innerHTML = nodeNoticeHTML;
      return;
    }
    renderNodeCards(orderedNodes, { noticeHTML: nodeNoticeHTML });
  }
  restoreManualWatchlistInputInteraction(manualWatchlistInteraction);
}

function section(title, body, open = false, extraClass = "") {
  return `
    <details class="detail-card liquid-glass ${escapeHtml(extraClass)}" ${open ? "open" : ""}>
      <summary>${escapeHtml(title)}</summary>
      <div class="detail-body">${body}</div>
    </details>
  `;
}

function hasValue(value) {
  return value !== undefined && value !== null && String(value).trim() !== "";
}

function formatDetailDateTime(dateString) {
  const date = new Date(dateString);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleString("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function cleanSourceLabel(source) {
  const label = String(source || "").trim();
  return label.toLowerCase() === "manual entry" ? "" : label;
}

function formatFactualValue(value) {
  if (!hasValue(value)) return "";
  if (typeof value === "number") return new Intl.NumberFormat("en-US").format(value);
  return String(value);
}

function detailRows(rows) {
  const visibleRows = rows.filter((row) => hasValue(row.value));
  if (!visibleRows.length) return "";

  return `
    <ul class="asset-list">
      ${visibleRows.map((row) => `
        <li class="asset-card">
          <div class="asset-top"><h3>${escapeHtml(row.label)}</h3></div>
          <p>${row.html || escapeHtml(formatFactualValue(row.value))}</p>
        </li>
      `).join("")}
    </ul>
  `;
}

function renderResearchEvidence(evidence) {
  if (!hasResearchEvidence(evidence)) return "";
  const sources = Array.isArray(evidence.sources) ? evidence.sources : [];
  const missingData = Array.isArray(evidence.missingData) ? evidence.missingData : [];
  const sourceCards = sources.map((source) => `
    <li class="asset-card evidence-source">
      <div class="evidence-head">
        <h3>${escapeHtml(source.sourceName)}</h3>
        <span class="status-pill status-${escapeHtml(source.status)}">${escapeHtml(formatLabel(source.status))}</span>
      </div>
      ${source.metadataOnly ? `<p class="evidence-note">Headlines are metadata only, not confirmed article research.</p>` : ""}
      ${source.facts?.length ? `
        <ul class="evidence-fact-list">
          ${source.facts.map((fact) => `<li>${escapeHtml(fact)}</li>`).join("")}
        </ul>
      ` : `<p>Source selected, but no compact observation was available.</p>`}
    </li>
  `).join("");
  const missingCard = missingData.length ? `
    <li class="asset-card evidence-source">
      <div class="evidence-head">
        <h3>Missing data / source warnings</h3>
        <span class="status-pill">Missing</span>
      </div>
      <ul class="evidence-fact-list">
        ${missingData.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
      </ul>
    </li>
  ` : "";

  return `
    <p class="research-evidence-note">API observations are supporting evidence. They do not automatically prove market impact; failed sources are missing data, not evidence.</p>
    <ul class="asset-list">
      ${sourceCards}
      ${missingCard}
    </ul>
  `;
}

function renderMissingDataReview(evidence) {
  const missingData = Array.isArray(evidence?.missingData) ? evidence.missingData : [];
  if (!missingData.length) return "";
  return `
    <ul class="asset-list">
      <li class="asset-card evidence-source">
        <div class="evidence-head">
          <h3>Missing data / source warnings</h3>
          <span class="status-pill">Review</span>
        </div>
        <ul class="evidence-fact-list">
          ${missingData.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
        </ul>
      </li>
    </ul>
  `;
}

function renderSourceReviewStatus(node, researchEvidence) {
  const sources = Array.isArray(node.sources)
    ? node.sources.map(cleanSourceLabel).filter(Boolean)
    : [];
  const sourceHTML = sources.length ? `
    <ul class="source-list">
      ${sources.map((source) => `
        <li class="asset-card evidence-source">
          <div class="evidence-head">
            <h3>${escapeHtml(source)}</h3>
            <span class="status-pill">Source</span>
          </div>
        </li>
      `).join("")}
    </ul>
  ` : `<p>${node.isSupabaseNode ? "Source details not available for this node yet." : "Source details not available in this demo node."}</p>`;
  const statusHTML = detailRows([
    { label: "Data status", value: node.isSupabaseNode ? "Live data loaded" : "Demo fallback data" },
    { label: "Review status", value: hasValue(node.status) ? formatLabel(node.status) : "" },
    { label: "Event status", value: hasValue(node.eventStatus) ? formatLabel(node.eventStatus) : "" }
  ]);
  const evidenceNote = hasResearchEvidence(researchEvidence)
    ? `<p class="evidence-note">Additional research evidence is shown below.</p>`
    : "";

  return [statusHTML, sourceHTML, evidenceNote].filter(Boolean).join("");
}

function renderUpcomingDetail(event) {

  selectedUpcomingEventId = eventId;
  activeView = ["home", "watchlist", "saved"].includes(activeView) ? activeView : "home";

  detailScreen.hidden = false;

  updateTopHeader();

  document.querySelector("#node-title").textContent = event.title;

  document.querySelector("#impact-label").textContent = "";
  document.querySelector("#confidence-label").hidden = true;
  document.querySelector("#confidence-label").textContent = "";

  document.querySelector("#event-type-label").textContent = "";
  document.querySelector("#event-status-label").hidden = true;

}

function assetDisplayName(a) {
  if (a.name && a.ticker) return `${a.name} (${a.ticker})`;
  return a.name || a.ticker || "";
}

function nodeDirClass(direction) {
  const d = String(direction || "").toLowerCase();
  if (d === "positive" || d.startsWith("up")) return "direction-positive";
  if (d === "negative" || d.startsWith("down")) return "direction-negative";
  return "direction-mixed";
}

function nodeDirWord(item) {
  const d = String((item && item.direction) || "mixed").toLowerCase();
  if (d === "positive" || d.startsWith("up")) return "Positive";
  if (d === "negative" || d.startsWith("down")) return "Negative";
  return "Mixed";
}

function chainStepsFor(chain) {
  if (Array.isArray(chain.steps) && chain.steps.length) {
    return chain.steps.map((s) => (typeof s === "string" ? { kind: "", text: s } : { kind: s.kind || "", text: s.text || "" }));
  }
  const derived = [];
  if (hasValue(chain.event)) derived.push({ kind: "Observed", text: chain.event });
  if (hasValue(chain.mechanism)) derived.push({ kind: "Transmission", text: chain.mechanism });
  if (hasValue(chain.sectorImpact)) derived.push({ kind: "Derived", text: chain.sectorImpact });
  if (hasValue(chain.assetImpact)) derived.push({ kind: "Derived", text: chain.assetImpact });
  return derived;
}

function chainCounterforceText(chain) {
  if (Array.isArray(chain.counterforces) && chain.counterforces.length) return chain.counterforces.join(" ");
  if (typeof chain.counterforces === "string") return chain.counterforces;
  return "";
}

function renderCausalChains(chains) {
  if (!chains.length) return "";
  const items = chains.map((chain, index) => {
    const steps = chainStepsFor(chain);
    const stepsHTML = steps.length
      ? `<ul class="cc-steps">${steps.map((s, stepIndex) => `<li class="cc-step"><span class="cc-step-num">${stepIndex + 1}</span><span class="cc-step-text">${escapeHtml(s.text)}</span></li>`).join("")}</ul>`
      : "";
    const force = chainCounterforceText(chain);
    const forceHTML = force ? `<p class="cc-force"><strong>Counterforces:</strong> ${escapeHtml(force)}</p>` : "";
    const tagline = hasValue(chain.tagline) ? chain.tagline : "";
    return `<details class="cc"${index === 0 ? " open" : ""}><summary><span class="cc-head"><span class="cc-title">${escapeHtml(chain.title || "")}</span>${tagline ? `<span class="cc-mech">${escapeHtml(tagline)}</span>` : ""}</span></summary><div class="cc-body">${stepsHTML}${forceHTML}</div></details>`;
  }).join("");
  return `<div class="cc-list">${items}</div>`;
}

function marketEffectRow(item) {
  const reason = item.reason || item.whyRelevant || "";
  const name = `<span class="kme-name">${escapeHtml(item.name || item.ticker || "")}</span>`;
  const dir = `<span class="kme-dir ${nodeDirClass(item.direction)}">${escapeHtml(nodeDirWord(item))}</span>`;
  if (!hasValue(reason)) {
    return `<div class="kme kme-flat">${name}${dir}</div>`;
  }
  return `<details class="kme"><summary>${name}${dir}</summary><div class="kme-body"><p>${escapeHtml(reason)}</p></div></details>`;
}

function renderKeyMarketEffects(directList, indirectList) {
  const blocks = [];
  if (directList.length) blocks.push(`<p class="kme-group">Direct impact</p><div class="kme-list">${directList.map(marketEffectRow).join("")}</div>`);
  if (indirectList.length) blocks.push(`<p class="kme-group">Indirect impact</p><div class="kme-list">${indirectList.map(marketEffectRow).join("")}</div>`);
  return blocks.join("");
}

function collectWatchItems(node, chains) {
  if (Array.isArray(node.watchItems) && node.watchItems.length) return node.watchItems;
  const items = [];
  chains.forEach((c) => {
    if (hasValue(c.watch)) items.push({ observation: c.title || "Watch", note: typeof c.watch === "string" ? c.watch : "" });
  });
  return items;
}

function renderWatchItems(items) {
  if (!items.length) return "";
  return `<ul class="watch-list">${items.map((w) => {
    const parts = [];
    if (hasValue(w.note)) parts.push(w.note);
    if (!parts.length && hasValue(w.confirms)) parts.push(`Confirms: ${w.confirms}`);
    if (!hasValue(w.note) && hasValue(w.challenges)) parts.push(`Challenges: ${w.challenges}`);
    const text = parts.join(" · ");
    return `<li class="watch-item"><p class="watch-obs">${escapeHtml(w.observation || "")}</p>${text ? `<p class="watch-note">${escapeHtml(text)}</p>` : ""}</li>`;
  }).join("")}</ul>`;
}

function renderExposuresBlock(node, exposuresToWatch) {
  const sector = Array.isArray(node.sectorExposures) ? node.sectorExposures : [];
  let html = "";
  if (sector.length) {
    html += `<ul class="exp-list">${sector.map((e) => `<li class="exp-item"><span class="exp-name">${escapeHtml(e.name || e.theme || "")}</span><span class="exp-dir ${nodeDirClass(e.direction)}">${escapeHtml(nodeDirWord(e))}</span></li>`).join("")}</ul>`;
  } else if (exposuresToWatch.length) {
    html += `<ul class="exp-list">${exposuresToWatch.map((e) => {
      const etfs = getExposureSectorEtfs(e);
      const name = `${e.theme || "Exposure"}${etfs.length ? ` (${etfs.join(" ")})` : ""}`;
      return `<li class="exp-item"><span class="exp-name">${escapeHtml(name)}</span>${e.directionHint ? `<span class="exp-dir ${nodeDirClass(e.directionHint)}">${escapeHtml(formatLabel(e.directionHint))}</span>` : ""}</li>`;
    }).join("")}</ul>`;
  }
  if (hasValue(node.researchCandidates)) html += `<div class="exp-block"><p class="exp-note">${escapeHtml(node.researchCandidates)}</p></div>`;
  return html;
}

function renderKeyNumbers(facts) {
  if (!Array.isArray(facts) || !facts.length) return "";
  return `<div class="facts-grid">${facts.map((f) => `<div class="facts-row"><span class="facts-label">${escapeHtml(f.label)}</span><span class="facts-value">${escapeHtml(f.value)}</span></div>`).join("")}</div>`;
}

function renderRisksScenarios(scenarios, counterarguments) {
  let html = "";
  if (scenarios.length) html += `<ul class="risk-scenarios">${scenarios.map((s) => `<li><p class="risk-scenario-title">${escapeHtml(s.title)}</p><p class="risk-scenario-body">${escapeHtml(s.body)}</p></li>`).join("")}</ul>`;
  if (counterarguments.length) html += `<p class="risk-counter-title">Counterarguments</p><ul class="risk-counter-list">${counterarguments.map((c) => `<li>${escapeHtml(c)}</li>`).join("")}</ul>`;
  return html;
}

function renderDetail(node) {

  saveButton.classList.toggle("saved", isSaved);
  if (reviewActions) reviewActions.hidden = !(reviewModeEnabled && isDraftNode);
  if (publishButton) publishButton.hidden = !(reviewModeEnabled && isDraftNode);
  if (archiveButton) archiveButton.hidden = !(reviewModeEnabled && isDraftNode);

  const chains = Array.isArray(node.chains) ? node.chains : [];
  const affectedAssets = Array.isArray(node.affectedAssets) ? node.affectedAssets.filter(isValidatedAsset) : [];
  const indirectImpacts = filterDuplicateIndirectImpacts(Array.isArray(node.indirectImpacts) ? node.indirectImpacts : [], affectedAssets);
  const exposuresToWatch = Array.isArray(node.exposuresToWatch) ? node.exposuresToWatch : (Array.isArray(node.researchExposures) ? node.researchExposures : []);
  const researchEvidence = node.researchEvidence || { sources: [], missingData: [] };
  const missingDataHTML = isReviewNode ? renderMissingDataReview(researchEvidence) : "";
  const scenarios = Array.isArray(node.scenarios) ? node.scenarios : [];

  const whyMattersHTML = `${hasValue(node.whyMatters) ? `<p class="wim-lead">${escapeHtml(node.whyMatters)}</p>` : ""}${renderCausalChains(chains)}`;
  const directEffects = (node.keyMarketEffects && Array.isArray(node.keyMarketEffects.direct))

  const indirectEffects = (node.keyMarketEffects && Array.isArray(node.keyMarketEffects.indirect))

  const keyMarketEffectsHTML = renderKeyMarketEffects(directEffects, indirectEffects);
  const watchHTML = renderWatchItems(collectWatchItems(node, chains));
  const exposuresBlockHTML = renderExposuresBlock(node, exposuresToWatch);
  const risksHTML = renderRisksScenarios(scenarios, counterarguments);
  const researchEvidenceHTML = renderResearchEvidence(researchEvidence);
  const sourceStatusHTML = renderSourceReviewStatus(node, researchEvidence);

  detailSections.innerHTML = [
    ...(isReviewNode ? [section("Review Status", detailRows([
      { label: "Node status", value: formatLabel(nodeStatus) },
      { label: "Review", value: isDraftNode ? "Review required before publishing." : "Already published or outside draft queue." }
    ]), true, "review-status-section")] : []),
    ...((hasValue(node.whyMatters) || chains.length) ? [section("Why it matters", whyMattersHTML, true)] : []),
    ...(keyMarketEffectsHTML ? [section("Key market effects", keyMarketEffectsHTML, true)] : []),
    ...(watchHTML ? [section("What to watch next", watchHTML)] : []),
    ...(exposuresBlockHTML ? [section("Sector & company exposures", exposuresBlockHTML)] : []),
    ...(risksHTML ? [section("Risks & scenarios", risksHTML)] : []),
    ...(reviewModeEnabled ? [section("Sources & review", sourceStatusHTML, false, "review-status-section")] : []),
    ...(missingDataHTML ? [section("Missing Data", missingDataHTML, false, "review-status-section")] : []),
    ...(reviewModeEnabled && researchEvidenceHTML ? [section("Research Evidence", researchEvidenceHTML, false, "research-evidence-section")] : []),
    `<p class="disclaimer">Not investment advice. No buy/sell recommendations or performance promises.</p>`
  ].join("");

  if (node.isSupabaseNode && !exposuresToWatch.length && !node.exposuresLoaded) {
    node.exposuresLoaded = true;
    loadResearchExposuresForNode(node.id).then((exposures) => {
      if (!exposures.length) return;
      node.researchExposures = exposures;
      node.exposuresToWatch = exposures;
      if (selectedNodeId === node.id) renderDetail(node);
    }).catch((error) => {
      console.warn("Clarifin Supabase: could not load node_research_exposures for selected node.", { nodeId: node.id, error });
    });
  }

  if (node.isSupabaseNode && !indirectImpacts.length && !node.indirectImpactsLoaded) {
    node.indirectImpactsLoaded = true;
    loadIndirectImpactsForNode(node.id).then((items) => {
      if (!items.length) return;
      node.indirectImpacts = items;
      if (selectedNodeId === node.id) renderDetail(node);
    }).catch((error) => {
      console.warn("Clarifin Supabase: could not load node_indirect_impacts for selected node.", { nodeId: node.id, error });
    });
  }

  if (node.isSupabaseNode && !hasResearchEvidence(researchEvidence) && !node.researchEvidenceLoaded) {
    node.researchEvidenceLoaded = true;
    loadResearchEvidenceForNode(node.id).then((evidence) => {
      if (!hasResearchEvidence(evidence)) return;
      node.researchEvidence = evidence;
      if (selectedNodeId === node.id) renderDetail(node);
    }).catch((error) => {
      console.warn("Clarifin Supabase: could not load research_fact_packs for selected node.", { nodeId: node.id, error });
    });
  }
}

eventList.addEventListener("click", (event) => {
  if (event.target.closest("[data-open-discover]")) {
    openLocalView("discover");
    return;
  }
  if (event.target.closest("[data-open-profile]")) {
    openLocalView("profile");
    return;
  }
  const profileAction = event.target.closest("[data-profile-action]");
  if (profileAction) {
    handleProfileAction(profileAction.dataset.profileAction);
    return;
  }
  const assetToggle = event.target.closest("[data-asset-watchlist-toggle]");
  if (assetToggle) {
    handleAssetWatchlistToggle(assetToggle.dataset.assetWatchlistToggle, {
      restoreFocus: event.detail === 0,
      scrollTop: appScreen.scrollTop
    });
    return;
  }
  const assetAction = event.target.closest("[data-open-asset]");
  if (assetAction) {
    openAssetDetail(assetAction.dataset.openAsset, {
      keyboardActivated: event.detail === 0,
      scrollTop: appScreen.scrollTop
    });
    return;
  }
  const linkedNodeAction = event.target.closest("[data-linked-node]");
  if (linkedNodeAction) {
    const linkedNode = getNode(linkedNodeAction.dataset.linkedNode);
    if (linkedNode) renderDetail(linkedNode);
    return;
  }
  const candidateAction = event.target.closest("[data-candidate-action]");
  if (candidateAction) {
    runCandidateAction(candidateAction.dataset.candidateAction, candidateAction.dataset.candidateId);
    return;
  }
  const card = event.target.closest(".event-card");
  if (!card) return;
  if (card.dataset.node) {
    renderDetail(getNode(card.dataset.node));
    return;
  }
  if (card.dataset.upcomingIndex) {
    const upcomingEvent = getSortedUpcomingEvents()[Number(card.dataset.upcomingIndex)];
    if (upcomingEvent) renderUpcomingDetail(upcomingEvent);
  }
});

eventList.addEventListener("input", (event) => {
  if (event.target.id !== "discover-search-input") return;
  discoverQuery = event.target.value || "";
  if (event.isComposing) return;
  localScreenMessage = "";
  renderDiscoverResults();
});

eventList.addEventListener("compositionend", (event) => {
  if (event.target.id !== "discover-search-input") return;
  discoverQuery = event.target.value || "";
  localScreenMessage = "";
  renderDiscoverResults();
});

screenIntro.addEventListener("input", (event) => {

  watchlistInputValue = event.target.value;
});

eventList.addEventListener("submit", (event) => {
  const profileForm = event.target.closest("#profile-form");
  if (!profileForm) return;
  event.preventDefault();
  const displayName = String(new FormData(profileForm).get("displayName") || "").trim() || "Guest";
  saveUserProfile({ displayName });
  localScreenMessage = "Local display name saved.";
  renderProfileScreen();
  announceStatus(localScreenMessage);
});

document.querySelector("#back-button").addEventListener("click", renderList);

saveButton.addEventListener("click", () => {
  if (selectedUpcomingEventId) {
    const upcomingEvent = getUpcomingEventById(selectedUpcomingEventId);
    if (!upcomingEvent || !toggleUpcomingEventSaved(upcomingEvent)) return;
    renderUpcomingDetail(upcomingEvent);
    return;
  }
  if (!selectedNodeId) return;
  savedNodeIds = savedNodeIds.includes(selectedNodeId)
    ? savedNodeIds.filter((id) => id !== selectedNodeId)
    : [...savedNodeIds, selectedNodeId];
  safeWriteLocalJson(SAVED_NODES_STORAGE_KEY, savedNodeIds);
  renderDetail(getNode(selectedNodeId));
});

  updateNodeReviewStatus(node, "published");
});

archiveButton?.addEventListener("click", () => {
  const node = getNode(selectedNodeId);
  if (!node) return;
  updateNodeReviewStatus(node, "archived");
});

screenIntro.addEventListener("click", (event) => {
  const watchlistAssetsToggle = event.target.closest("[data-watchlist-assets-toggle]");
  if (watchlistAssetsToggle) {
    const restoreKeyboardFocus = event.detail === 0;
    const previousScrollTop = appScreen.scrollTop;
    watchlistAssetsExpanded = !watchlistAssetsExpanded;
    renderList({ scrollToTop: false });
    appScreen.scrollTop = previousScrollTop;
    if (restoreKeyboardFocus) {
      document.querySelector("[data-watchlist-assets-toggle]")?.focus({ preventScroll: true });
    }
    return;
  }
  if (event.target.closest("[data-open-discover]")) {
    openLocalView("discover");
    return;
  }
  if (event.target.closest("[data-open-profile]")) {
    openLocalView("profile");
    return;
  }
  if (event.target.closest("[data-return-previous]")) {
    returnToPreviousView();
    return;
  }
  const assetAction = event.target.closest("[data-open-asset]");
  if (assetAction) {
    openAssetDetail(assetAction.dataset.openAsset, {
      keyboardActivated: event.detail === 0,
      scrollTop: appScreen.scrollTop
    });
    return;
  }
  if (event.target.closest("[data-return-asset]")) {
    returnFromAssetDetail({ keyboardActivated: event.detail === 0 });
    return;
  }
  const removeButton = event.target.closest("[data-watchlist-remove]");
  if (removeButton) {
    removeWatchlistSymbol(removeButton.dataset.watchlistRemove, {
      restoreFocus: event.detail === 0,
      scrollTop: appScreen.scrollTop
    });
    return;
  }
  if (event.target.closest("[data-watchlist-add]")) {
    showWatchlistInput();
    return;
  }
  if (event.target.closest("#cancel-watchlist-add")) {
    hideWatchlistInput();
    return;
  }
  const tab = event.target.closest("[data-review-tab]");
  if (tab) {
    reviewTab = tab.dataset.reviewTab || "drafts";
    renderList();
    return;
  }
  if (event.target.closest("#run-auto-pipeline")) {
    runAutoPipeline();
    return;
  }
  if (event.target.closest("#change-review-token")) {
    changeReviewAdminToken();
  }
});

screenIntro.addEventListener("submit", (event) => {
  const form = event.target.closest("#watchlist-form");
  if (!form) return;
  event.preventDefault();
  addWatchlistSymbol(new FormData(form).get("symbol"));
});

onboardingOverlay?.addEventListener("click", (event) => {
  const toggle = event.target.closest("[data-onboarding-toggle]");
  if (toggle) {
    onboardingOptionFocusTarget = {
      field: toggle.dataset.onboardingToggle,
      value: toggle.dataset.onboardingValue
    };
    toggleDraftArray(toggle.dataset.onboardingToggle, toggle.dataset.onboardingValue);
    renderOnboarding();
    return;
  }
  const action = event.target.closest("[data-onboarding-action]")?.dataset.onboardingAction;
  if (!action) return;
  onboardingOptionFocusTarget = null;
  if (action === "skip") {
    skipOnboarding();
  } else if (action === "back") {
    onboardingStep = Math.max(0, onboardingStep - 1);
    renderOnboarding();
  } else if (action === "next") {
    onboardingStep = Math.min(4, onboardingStep + 1);
    renderOnboarding();
  } else if (action === "finish") {
    completeOnboarding();
  }
});

document.addEventListener("keydown", handleOnboardingKeydown);

document.querySelectorAll(".event-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    eventMode = tab.dataset.eventMode;
    renderList();
  });
});

document.querySelectorAll(".nav-item").forEach((item) => {
  item.addEventListener("click", () => {
    activeView = item.dataset.view;
    eventMode = "top";
    setActiveNav(activeView);
    renderList();
  });
});

brandButton.addEventListener("click", goHome);

    goHome();
  }
});

avatarButton?.addEventListener("click", () => openLocalView("profile"));

safeWriteLocalJson(APPEARANCE_STORAGE_KEY, appearance);
savePreferences(preferences);
updateAvatar();

renderList();
if (!reviewModeEnabled && !isOnboardingComplete()) startOnboarding();
loadPublishedNodes();
loadDraftNodes();
loadEventCandidates();
loadUpcomingEvents();
