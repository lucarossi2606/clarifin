<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>clarifin prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      
      <header class="top-nav liquid-glass">
        <div class="brand">clarifin</div>
        <div class="next-event">NEXT: FOMC in 4h</div>
        <div class="avatar">L</div>
      </header>

      <main class="app-screen">
        <section class="screen list-screen" id="list-screen">
          <section class="greeting-section" id="screen-intro">
            <p class="date-label">Wednesday, 21 May</p>
            <h1>Good morning, Luca</h1>
          </section>

          <section class="feed-section">
            <div class="tabs-container" id="event-tabs">
              <button class="event-tab active" data-event-mode="top" type="button">
                Top Events <span class="dot"></span>
              </button>
              <button class="event-tab" data-event-mode="upcoming" type="button">Upcoming</button>
            </div>
            
            <div class="event-list" id="event-list"></div>
            
            <p class="disclaimer">Not investment advice. No buy/sell recommendations or performance promises.</p>
          </section>
        </section>

        <section class="screen detail-screen" id="detail-screen" hidden>
          <div class="detail-controls">
            <button class="action-btn liquid-glass" id="back-button" type="button">← Back</button>
            <button class="action-btn liquid-glass" id="save-node" type="button">Save</button>
          </div>

          <article class="detail-hero liquid-glass">
            <p class="category-pill" id="node-category">Node</p>
            <h1 id="node-title">Select a node</h1>
            <p class="detail-summary" id="node-summary"></p>
            <div class="signal-row">
              <span class="score-pill yellow" id="impact-label"></span>
              <span class="score-pill gray" id="confidence-label"></span>
            </div>
          </article>

          <div class="detail-sections" id="detail-sections"></div>
        </section>
      </main>

      <nav class="bottom-nav liquid-glass" aria-label="Primary navigation">
        <button class="nav-item active" data-view="home" type="button">Home</button>
        <button class="nav-item" data-view="watchlist" type="button">Watchlist</button>
        <button class="nav-item" data-view="saved" type="button">Saved</button>
      </nav>
      
    </div>
    <script src="app.js"></script>
  </body>
</html>
