  const chains = Array.isArray(node.chains) ? node.chains : [];
  const affectedAssets = Array.isArray(node.affectedAssets) ? node.affectedAssets.filter(isValidatedAsset) : [];
  const indirectImpacts = filterDuplicateIndirectImpacts(Array.isArray(node.indirectImpacts) ? node.indirectImpacts : [], affectedAssets);
  const exposuresToWatch = Array.isArray(node.exposuresToWatch) ? node.exposuresToWatch : (Array.isArray(node.researchExposures) ? node.researchExposures : []);
  const researchEvidence = node.researchEvidence || { sources: [], missingData: [] };
  const missingDataHTML = isReviewNode ? renderMissingDataReview(researchEvidence) : "";
  const scenarios = Array.isArray(node.scenarios) ? node.scenarios : [];
  const counterarguments = Array.isArray(node.counterarguments) ? node.counterarguments : [];

  const chainsHTML = chains.length
    ? `<ul class="chain-list">${chains.map(c => `<li class="chain-step"><strong>${escapeHtml(c.title)}</strong><p>${escapeHtml(c.explanation || c.assetImpact || c.sectorImpact || c.mechanism)}</p></li>`).join("")}</ul>`
    : "<p>No causal chains available yet.</p>";
  const assetsHTML = affectedAssets.length
    ? `<ul class="asset-list">${affectedAssets.map(a => `<li class="asset-card"><div class="asset-top"><h3>${escapeHtml(formatNameWithSymbol(a.ticker, a.name, "Direct impact"))}</h3><span class="direction-${a.direction}">${escapeHtml(formatLabel(a.direction))}</span></div>${a.assetClass ? `<p class="asset-subline"><strong>${escapeHtml(formatLabel(a.assetClass))}</strong></p>` : ""}<p>${escapeHtml(a.reason)}</p></li>`).join("")}</ul>`
    : "<p>No concrete affected assets yet.</p>";
  const indirectHTML = indirectImpacts.length
    ? `<ul class="asset-list">${indirectImpacts.map(item => `
      <li class="asset-card">
        <div class="asset-top">
          <h3>${escapeHtml(formatIndirectImpactHeading(item))}</h3>
          ${item.direction ? `<span class="direction-${item.direction}">${escapeHtml(formatLabel(item.direction))}</span>` : ""}
        </div>
        ${item.strength ? `<p class="asset-subline"><strong>${escapeHtml(formatLabel(item.strength))}</strong></p>` : ""}
        ${item.reason ? `<p>${escapeHtml(item.reason)}</p>` : ""}
        ${item.evidenceRequiredToUpgrade ? `<p class="evidence-note">Evidence required: ${escapeHtml(item.evidenceRequiredToUpgrade)}</p>` : ""}
      </li>`).join("")}</ul>`
    : "";
  const exposuresHTML = exposuresToWatch.length
    ? `<ul class="asset-list">${exposuresToWatch.map(exposure => {
      const sectorEtfs = getExposureSectorEtfs(exposure);
      return `
      <li class="asset-card">
        <div class="asset-top">
          <h3>${escapeHtml(exposure.theme || "Exposure to watch")}</h3>
          ${exposure.directionHint ? `<span class="direction-${exposure.directionHint}">${escapeHtml(formatLabel(exposure.directionHint))}</span>` : ""}
        </div>
        ${sectorEtfs.length ? `<p class="asset-subline exposure-etfs"><strong>${sectorEtfs.map(escapeHtml).join(" ")}</strong></p>` : ""}
        ${exposure.whyRelevant ? `<p>${escapeHtml(exposure.whyRelevant)}</p>` : ""}
      </li>`;
    }).join("")}</ul>`
    : "";
  const researchEvidenceHTML = renderResearchEvidence(researchEvidence);
  const scenariosHTML = scenarios.length
    ? `<ul class="scenario-list">${scenarios.map(s => `<li class="scenario-item"><strong>${escapeHtml(s.title)}:</strong><p>${escapeHtml(s.body)}</p></li>`).join("")}</ul>`
    : "<p>No scenarios available yet.</p>";
  const countersHTML = counterarguments.length
    ? `<ul class="counter-list">${counterarguments.map(c => `<li><p>${escapeHtml(c)}</p></li>`).join("")}</ul>`
    : "<p>No counterarguments available yet.</p>";
  const sourceStatusHTML = renderSourceReviewStatus(node, researchEvidence);

  detailSections.innerHTML = [
    ...(isReviewNode ? [section("Review Status", detailRows([
      { label: "Node status", value: formatLabel(nodeStatus) },
      { label: "Review", value: isDraftNode ? "Review required before publishing." : "Already published or outside draft queue." }
    ]), true, "review-status-section")] : []),
    section("Source / Review Status", sourceStatusHTML, true, "review-status-section"),
    section("Why it matters", `<p>${escapeHtml(node.whyMatters)}</p>`, true),
    section("Direct Impact", assetsHTML),
    ...(indirectHTML ? [section("Indirect Impact", indirectHTML)] : []),
    ...(exposuresHTML ? [section("Exposures to watch", exposuresHTML)] : []),
    section("Causal Chains", chainsHTML),
    section("Scenarios", scenariosHTML),
    section("Counterarguments", countersHTML),
    ...(missingDataHTML ? [section("Missing Data", missingDataHTML, false, "review-status-section")] : []),
    ...(researchEvidenceHTML ? [section("Research Evidence", researchEvidenceHTML, false, "research-evidence-section")] : [])
  ].join("");

  if (node.isSupabaseNode && !exposuresToWatch.length && !node.exposuresLoaded) {
    node.exposuresLoaded = true;
    loadResearchExposuresForNode(node.id).then((exposures) => {
      if (!exposures.length) return;
      node.researchExposures = exposures;
      node.exposuresToWatch = exposures;
      if (selectedNodeId === node.id) renderDetail(node);
    }).catch((error) => {
      console.warn("Clarifin Supabase: could not load node_research_exposures for selected node.", { nodeId: node.id, error });
    });
  }

  if (node.isSupabaseNode && !indirectImpacts.length && !node.indirectImpactsLoaded) {
    node.indirectImpactsLoaded = true;
    loadIndirectImpactsForNode(node.id).then((items) => {
      if (!items.length) return;
      node.indirectImpacts = items;
      if (selectedNodeId === node.id) renderDetail(node);
    }).catch((error) => {
      console.warn("Clarifin Supabase: could not load node_indirect_impacts for selected node.", { nodeId: node.id, error });
    });
  }

  if (node.isSupabaseNode && !hasResearchEvidence(researchEvidence) && !node.researchEvidenceLoaded) {
    node.researchEvidenceLoaded = true;
    loadResearchEvidenceForNode(node.id).then((evidence) => {
      if (!hasResearchEvidence(evidence)) return;
      node.researchEvidence = evidence;
      if (selectedNodeId === node.id) renderDetail(node);
    }).catch((error) => {
      console.warn("Clarifin Supabase: could not load research_fact_packs for selected node.", { nodeId: node.id, error });
    });
  }
}

eventList.addEventListener("click", (event) => {
  if (event.target.closest("[data-open-discover]")) {
    openLocalView("discover");
    return;
  }
  if (event.target.closest("[data-open-profile]")) {
    openLocalView("profile");
    return;
  }
  const profileAction = event.target.closest("[data-profile-action]");
  if (profileAction) {
    handleProfileAction(profileAction.dataset.profileAction);
    return;
  }
  const assetToggle = event.target.closest("[data-asset-watchlist-toggle]");
  if (assetToggle) {
    handleAssetWatchlistToggle(assetToggle.dataset.assetWatchlistToggle);
    return;
  }
  const assetCard = event.target.closest("[data-asset-symbol]");
  if (assetCard) {
    const asset = getAssetBySymbol(assetCard.dataset.assetSymbol);
    localScreenMessage = asset
      ? `${asset.symbol} detail will be added in a later MVP phase. This card currently uses local reference metadata only.`
      : "Asset detail will be added in a later MVP phase.";
    renderDiscoverResults();
    return;
  }
  const candidateAction = event.target.closest("[data-candidate-action]");
  if (candidateAction) {
    runCandidateAction(candidateAction.dataset.candidateAction, candidateAction.dataset.candidateId);
    return;
  }
  const card = event.target.closest(".event-card");
  if (!card) return;
  if (card.dataset.node) {
    renderDetail(getNode(card.dataset.node));
    return;
  }
  if (card.dataset.upcomingIndex) {
    const upcomingEvent = getSortedUpcomingEvents()[Number(card.dataset.upcomingIndex)];
    if (upcomingEvent) renderUpcomingDetail(upcomingEvent);
  }
});

eventList.addEventListener("input", (event) => {
  if (event.target.id !== "discover-search-input") return;
  discoverQuery = event.target.value || "";
  if (event.isComposing) return;
  localScreenMessage = "";
  renderDiscoverResults();
});

eventList.addEventListener("compositionend", (event) => {
  if (event.target.id !== "discover-search-input") return;
  discoverQuery = event.target.value || "";
  localScreenMessage = "";
  renderDiscoverResults();
});

eventList.addEventListener("submit", (event) => {
  const profileForm = event.target.closest("#profile-form");
  if (!profileForm) return;
  event.preventDefault();
  const displayName = String(new FormData(profileForm).get("displayName") || "").trim() || "Guest";
  saveUserProfile({ displayName });
  localScreenMessage = "Local display name saved.";
  renderProfileScreen();
});

document.querySelector("#back-button").addEventListener("click", renderList);

saveButton.addEventListener("click", () => {
  if (!selectedNodeId) return;
  savedNodeIds = savedNodeIds.includes(selectedNodeId)
    ? savedNodeIds.filter((id) => id !== selectedNodeId)
    : [...savedNodeIds, selectedNodeId];
  safeWriteLocalJson(SAVED_NODES_STORAGE_KEY, savedNodeIds);
  renderDetail(getNode(selectedNodeId));
});

publishButton?.addEventListener("click", () => {
  const node = getNode(selectedNodeId);
  if (!node) return;
  updateNodeReviewStatus(node, "published");
});

archiveButton?.addEventListener("click", () => {
  const node = getNode(selectedNodeId);
  if (!node) return;
  updateNodeReviewStatus(node, "archived");
});

screenIntro.addEventListener("click", (event) => {
  if (event.target.closest("[data-open-discover]")) {
    openLocalView("discover");
    return;
  }
  if (event.target.closest("[data-open-profile]")) {
    openLocalView("profile");
    return;
  }
  if (event.target.closest("[data-return-previous]")) {
    returnToPreviousView();
    return;
  }
  const removeButton = event.target.closest("[data-watchlist-remove]");
  if (removeButton) {
    removeWatchlistSymbol(removeButton.dataset.watchlistRemove);
    return;
  }
  if (event.target.closest("[data-watchlist-add]")) {
    showWatchlistInput();
    return;
  }
  if (event.target.closest("#cancel-watchlist-add")) {
    hideWatchlistInput();
    return;
  }
  const tab = event.target.closest("[data-review-tab]");
  if (tab) {
    reviewTab = tab.dataset.reviewTab || "drafts";
    renderList();
    return;
  }
  if (event.target.closest("#run-auto-pipeline")) {
    runAutoPipeline();
    return;
  }
  if (event.target.closest("#change-review-token")) {
    changeReviewAdminToken();
  }
});

screenIntro.addEventListener("submit", (event) => {
  const form = event.target.closest("#watchlist-form");
  if (!form) return;
  event.preventDefault();
  addWatchlistSymbol(new FormData(form).get("symbol"));
});

onboardingOverlay?.addEventListener("click", (event) => {
  const toggle = event.target.closest("[data-onboarding-toggle]");
  if (toggle) {
    toggleDraftArray(toggle.dataset.onboardingToggle, toggle.dataset.onboardingValue);
    renderOnboarding();
    return;
  }
  const action = event.target.closest("[data-onboarding-action]")?.dataset.onboardingAction;
  if (!action) return;
  if (action === "skip") {
    skipOnboarding();
  } else if (action === "back") {
    onboardingStep = Math.max(0, onboardingStep - 1);
    renderOnboarding();
  } else if (action === "next") {
    onboardingStep = Math.min(4, onboardingStep + 1);
    renderOnboarding();
  } else if (action === "finish") {
    completeOnboarding();
  }
});

document.addEventListener("keydown", handleOnboardingKeydown);

document.querySelectorAll(".event-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    eventMode = tab.dataset.eventMode;
    renderList();
  });
});

document.querySelectorAll(".nav-item").forEach((item) => {
  item.addEventListener("click", () => {
    activeView = item.dataset.view;
    eventMode = "top";
    setActiveNav(activeView);
    renderList();
  });
});

brandButton.addEventListener("click", goHome);
brandButton.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    goHome();
  }
});
searchButton?.addEventListener("click", () => openLocalView("discover"));
avatarButton?.addEventListener("click", () => openLocalView("profile"));

safeWriteLocalJson(APPEARANCE_STORAGE_KEY, appearance);
savePreferences(preferences);
updateAvatar();

renderList();
if (!reviewModeEnabled && !isOnboardingComplete()) startOnboarding();
loadPublishedNodes();
loadDraftNodes();
loadEventCandidates();
loadUpcomingEvents();
