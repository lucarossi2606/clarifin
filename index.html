<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clarifin prototype</title>
    <style>
:root {
  color-scheme: light;
  --bg-app: #fafbfc;
  --text-main: #111827;
  --text-muted: #7D828A;
  --text-light: #BCC2CA;
  --green-bg: rgba(16, 185, 129, 0.12);
  --green-text: #059669;
  --red-bg: rgba(239, 68, 68, 0.12);
  --red-text: #dc2626;
  --gray-bg: rgba(107, 114, 128, 0.12);
  --gray-text: #7e899a;
  --yellow-bg: rgba(245, 158, 11, 0.15);
  --yellow-text: #b45309;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-weight: 700; }

html { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #f1f3f6;
  color: var(--text-main);
}

button { border: 0; font: inherit; background: none; padding: 0; cursor: pointer; }
input { font: inherit; }
button:focus-visible, input:focus-visible {
  outline: 3px solid rgba(17, 24, 39, 0.22);
  outline-offset: 2px;
}

.phone-shell {
  width: min(100%, 414px);
  height: 100dvh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg-app);
  position: relative;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.12);
}

.app-screen {
  padding: 96px 16px calc(170px + env(safe-area-inset-bottom, 0px)) 16px;
  height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.screen[hidden] { display: none; }

.liquid-glass {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.1) 100%);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-top: 1px solid rgba(255, 255, 255, 0.85); 
  border-left: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.8), inset 0 -2px 6px rgba(0, 0, 0, 0.03), 0 12px 32px rgba(0, 0, 0, 0.08); 
}

.top-nav {
  position: absolute; top: 16px; left: 16px; right: 16px; height: 56px;
  border-radius: 99px; display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4) 0 var(--sp-5); z-index: 100;
}

.brand { flex: 0 0 auto; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; color: var(--text-main); }
.next-event { flex: 1 1 auto; min-width: 0; color: var(--text-light); font-size: 13px; font-weight: 700; overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
.top-actions { flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-2); }
.top-action { width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; border-radius: 50%; background: transparent; color: var(--text-main); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.top-action:hover, .top-action:focus-visible, .top-action:active { background: rgba(17, 24, 39, 0.06); }
.top-action svg { width: 23px; height: 23px; display: block; }
.avatar { flex: 0 0 auto; position: relative; z-index: 0; width: 44px; height: 44px; min-width: 44px; min-height: 44px; background: transparent; color: #fff; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.avatar::before { content: ""; position: absolute; z-index: -1; width: 36px; height: 36px; border-radius: 50%; background: var(--text-main); }

.greeting-section { margin-bottom: var(--sp-6); padding-top: var(--sp-2); }
.date-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 var(--sp-1) 0; }
.greeting-section h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 var(--sp-1) 0; }

.tabs-container { display: inline-flex; background: rgba(0, 0, 0, 0.04); padding: 4px; border-radius: 99px; margin-bottom: var(--sp-4); }
.event-tab { padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--text-muted); transition: all 0.2s ease; }
.event-tab.active { background: #fff; color: var(--text-main); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); }
.event-tab[data-event-mode="upcoming"] { color: var(--text-muted); }

.dot { display: inline-block; width: 6px; height: 6px; background: var(--red-text); border-radius: 50%; margin-left: 4px; vertical-align: 2px; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

.event-list { display: flex; flex-direction: column; gap: var(--sp-4); }

.event-card {
  border-radius: 24px; padding: var(--sp-5); text-align: left; position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease; display: block; width: 100%;
}
.event-card.upcoming-card { padding-bottom: 44px; }
.event-card.upcoming-card h2, .event-card.upcoming-card > p { max-width: calc(100% - 64px); }
.event-card.liquid-glass, .detail-hero.liquid-glass, .detail-card.liquid-glass { box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.72), inset 0 -1px 4px rgba(0, 0, 0, 0.02), 0 7px 20px rgba(0, 0, 0, 0.045); }
.event-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08); }
.event-card:active { transform: scale(0.98); }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
.category-pill { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--sp-2); }

.region-flag {
  width: 24px; height: 24px; border-radius: 50%; object-fit: contain;
  background: transparent; flex-shrink: 0; margin-left: 8px;
}

.event-card h2 { font-size: 18px; font-weight: 700; line-height: 1.25; margin: 0 0 var(--sp-2) 0; letter-spacing: -0.3px; max-width: calc(100% - 64px); overflow-wrap: anywhere; }
.event-card > p { font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--text-light); line-height: 1.4; margin: 0 0 var(--sp-4) 0; max-width: calc(100% - 64px); overflow-wrap: anywhere; }

.card-meta { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.score-pill { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; background: var(--yellow-bg); color: var(--yellow-text); }
.score-pill.gray { background: var(--gray-bg); color: var(--gray-text); }

.ticker-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding-right: 40px; }
.ticker-chip { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
.ticker-chip.positive { background: var(--green-bg); color: var(--green-text); }
.ticker-chip.negative { background: var(--red-bg); color: var(--red-text); }
.ticker-chip.mixed, .ticker-chip.neutral { background: var(--gray-bg); color: var(--gray-text); }

.timestamp { position: absolute; bottom: 20px; right: 16px; font-size: 11px; font-weight: 700; color: var(--text-light); }
.upcoming-card .timestamp { right: 20px; bottom: 18px; }

.detail-controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); }
.action-btn { min-height: 40px; padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.8); }
.action-btn.saved { background: var(--yellow-bg); color: var(--yellow-text); border-color: transparent; }
.action-btn.publish-action { background: var(--green-bg); color: var(--green-text); border-color: transparent; }
.action-btn.archive-action { background: var(--gray-bg); color: var(--gray-text); border-color: transparent; }
.review-actions { display: flex; gap: var(--sp-2); margin-left: auto; }
.review-badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 8px; background: var(--yellow-bg); color: var(--yellow-text); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-left: var(--sp-2); }
.review-card-note { color: var(--text-muted); font-size: 13px; line-height: 1.4; margin: var(--sp-2) 0 0 0; }
.review-token-action { margin-top: var(--sp-3); padding: 7px 12px; border-radius: 99px; background: var(--gray-bg); color: var(--gray-text); font-size: 13px; font-weight: 700; }
.review-toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
.review-mini-tabs { display: inline-flex; background: rgba(0, 0, 0, 0.04); padding: 4px; border-radius: 99px; margin-top: var(--sp-3); }
.review-mini-tab { padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--text-muted); }
.review-mini-tab.active { background: #fff; color: var(--text-main); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); }
.candidate-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
.candidate-actions .action-btn { font-size: 12px; padding: 7px 10px; }
.candidate-score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: var(--sp-2); margin: var(--sp-3) 0; }
.candidate-score { background: rgba(0, 0, 0, 0.03); border-radius: 10px; padding: var(--sp-2); }
.candidate-score span { display: block; color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
.candidate-score strong { display: block; margin-top: 2px; color: var(--text-main); font-size: 14px; }
.candidate-facts { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: var(--sp-2) 0; }
.candidate-fact { display: inline-flex; align-items: center; gap: 4px; border-radius: 10px; background: rgba(0, 0, 0, 0.035); padding: 5px 8px; color: var(--text-muted); font-size: 11px; font-weight: 700; }
.candidate-fact strong { color: var(--text-main); font-weight: 700; }
.pipeline-result { margin-top: var(--sp-3); color: var(--text-muted); font-size: 13px; line-height: 1.4; }
.data-status-card { border-radius: 18px; padding: var(--sp-4); margin-bottom: var(--sp-4); text-align: left; }
.data-status-card h2 { margin: 0 0 var(--sp-1) 0; font-size: 15px; line-height: 1.25; color: var(--text-main); }
.data-status-card p { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.4; }
.data-status-card.status-fallback { background: var(--yellow-bg); color: var(--yellow-text); }
.data-status-card.status-error { background: var(--red-bg); color: var(--red-text); }
.data-status-card.status-loading { background: var(--gray-bg); color: var(--gray-text); }
.data-status-card.status-fallback h2,
.data-status-card.status-fallback p { color: var(--yellow-text); }
.data-status-card.status-error h2,
.data-status-card.status-error p { color: var(--red-text); }

.watchlist-controls { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-4); }
.watchlist-symbols { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.watchlist-symbol { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: var(--gray-bg); color: var(--gray-text); font-size: 12px; font-weight: 700; }
.watchlist-remove { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: rgba(0, 0, 0, 0.08); color: var(--text-muted); font-size: 14px; line-height: 1; }
.watchlist-form { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.watchlist-input { min-width: 0; flex: 1 1 120px; height: 36px; border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 99px; padding: 0 12px; background: rgba(255, 255, 255, 0.72); color: var(--text-main); font: inherit; font-size: 13px; outline: none; }
.watchlist-input:focus { border-color: rgba(17, 24, 39, 0.22); box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.06); }
.watchlist-message { margin: 0; color: var(--text-muted); font-size: 12px; line-height: 1.4; }
.watchlist-empty { display: flex; flex-direction: column; gap: var(--sp-2); }

.detail-hero { border-radius: 24px; padding: var(--sp-5); margin-bottom: var(--sp-3); }
.detail-hero h1 { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 0 0 var(--sp-3) 0; letter-spacing: -0.5px; }
.detail-summary { font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--text-light); line-height: 1.5; margin: 0 0 var(--sp-4) 0; }
.signal-row { display: flex; gap: var(--sp-2); }

.detail-sections { display: flex; flex-direction: column; gap: var(--sp-3); }
.detail-card { border-radius: 24px; }
details.detail-card summary { padding: var(--sp-5); font-size: 16px; font-weight: 700; color: var(--text-main); list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.detail-card summary::-webkit-details-marker { display: none; }
details.detail-card summary::after { content: "+"; font-size: 18px; font-weight: 700; color: var(--text-muted); }
details.detail-card[open] summary::after { content: "-"; }

.detail-body { padding: 0 var(--sp-5) var(--sp-5) var(--sp-5); font-size: 14px; line-height: 1.5; color: var(--text-muted); font-weight: 400; }
.detail-body p, .detail-body li { font-family: inherit; font-size: 14px; line-height: 1.5; color: var(--text-muted); font-weight: 400; }

.chain-list, .asset-list, .scenario-list, .counter-list, .source-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.chain-step strong, .scenario-item strong { display: block; color: var(--text-main); margin-bottom: 4px; font-size: 15px; font-weight: 700; }
.chain-step p, .scenario-item p { margin: 0 0 6px 0; }

.asset-card { background: rgba(0, 0, 0, 0.03); padding: var(--sp-3); border-radius: 12px; }
.asset-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
.asset-top h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-main); }
.asset-top span { font-size: 12px; font-weight: 700; text-transform: capitalize; }
.asset-card .asset-subline { margin: 4px 0 0 0; color: var(--text-muted); font-size: 13px; font-weight: 700; line-height: 1.4; }
.exposure-etfs { word-spacing: 6px; }
.direction-positive { color: var(--green-text); }
.direction-negative { color: var(--red-text); }
.direction-mixed, .direction-neutral { color: var(--gray-text); }
.asset-card p { margin: 4px 0 0 0; font-size: 13px; }
.asset-card .evidence-note { color: var(--text-light); font-size: 12px; line-height: 1.4; margin-top: 6px; }
.research-evidence-note { color: var(--text-light); font-size: 12px; line-height: 1.4; margin: 0 0 var(--sp-3) 0; }
.research-evidence-section { opacity: 0.88; }
.research-evidence-section summary { color: var(--text-muted); font-size: 14px; }
.research-evidence-section .detail-body { color: var(--text-light); }
.research-evidence-section .asset-card { background: rgba(0, 0, 0, 0.02); }
.evidence-source { display: flex; flex-direction: column; gap: 6px; }
.evidence-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
.evidence-head h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-main); }
.status-pill { padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: capitalize; background: var(--gray-bg); color: var(--gray-text); white-space: nowrap; }
.status-success { background: var(--green-bg); color: var(--green-text); }
.status-partial_success { background: var(--yellow-bg); color: var(--yellow-text); }
.status-failed, .status-timeout, .status-rate_limited { background: var(--red-bg); color: var(--red-text); }
.status-draft { background: var(--yellow-bg); color: var(--yellow-text); }
.status-published { background: var(--green-bg); color: var(--green-text); }
.review-status-section { border-color: rgba(245, 158, 11, 0.28); }
.evidence-fact-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.evidence-fact-list li { color: var(--text-muted); font-size: 13px; font-weight: 400; line-height: 1.4; }

.screen-actions, .profile-actions, .onboarding-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.screen-actions { margin-top: var(--sp-3); }
.manual-watchlist-action { min-height: 44px; padding: 0; border-color: transparent; color: var(--text-muted); text-align: left; }
.field-label { display: block; margin: 0 0 var(--sp-2) 0; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
.search-input, .profile-input {
  width: 100%;
  min-height: 44px;
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 14px;
  padding: 0 12px;
  background: rgba(255, 255, 255, 0.72);
  color: var(--text-main);
  outline: none;
}
.search-input:focus, .profile-input:focus { border-color: rgba(17, 24, 39, 0.22); box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.06); }
.asset-result-meta, .profile-muted, .local-note { margin: var(--sp-2) 0 0 0; color: var(--text-muted); font-size: 13px; line-height: 1.4; }
.asset-result-meta { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
#discover-results { display: flex; flex-direction: column; gap: var(--sp-4); }
.asset-card-action { margin-top: var(--sp-3); }
.preference-chips, .profile-stats, .option-grid { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.preference-chip, .profile-stat, .option-pill {
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.04);
  color: var(--text-muted);
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.2;
}
.option-pill {
  min-height: 40px;
  border: 1px solid transparent;
  text-align: left;
}
.option-pill.selected { background: var(--text-main); color: #fff; }
.profile-stat strong { display: block; color: var(--text-main); font-size: 18px; line-height: 1.1; }
.profile-form { display: grid; gap: var(--sp-3); margin-top: var(--sp-3); }
.future-entry { width: 100%; justify-content: flex-start; text-align: left; }
.onboarding-overlay {
  position: absolute;
  inset: 0;
  z-index: 100000;
  display: grid;
  align-items: end;
  padding: 88px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  background: rgba(241, 243, 246, 0.72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.onboarding-overlay[hidden] { display: none; }
.onboarding-dialog {
  width: 100%;
  max-height: calc(100dvh - 112px);
  overflow-y: auto;
  border-radius: 24px;
  padding: var(--sp-5);
}
.onboarding-dialog h2 { margin: 0 0 var(--sp-2) 0; font-size: 22px; line-height: 1.2; }
.onboarding-dialog p { margin: 0 0 var(--sp-4) 0; color: var(--text-muted); font-size: 14px; line-height: 1.45; }
.onboarding-dialog .onboarding-welcome-description { color: var(--text-light); }
.onboarding-progress { margin-bottom: var(--sp-3); color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
.onboarding-actions { justify-content: space-between; margin-top: var(--sp-4); }

.bottom-nav {
  position: fixed !important;
  left: 50% !important;
  right: auto !important;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)) !important;
  transform: translateX(-50%);
  width: min(382px, calc(100vw - 32px));
  height: 64px;
  border-radius: 99px;
  display: flex !important;
  justify-content: space-around;
  align-items: center;
  padding: 0 var(--sp-2);
  z-index: 99999;
  opacity: 1;
  visibility: visible;
}
.bottom-nav[hidden] { display: none; }
.nav-item { flex: 1; min-height: 44px; text-align: center; padding: 12px 0; border-radius: 99px; font-size: 14px; font-weight: 700; color: var(--text-main); transition: all 0.2s ease; }
.nav-item.active { background: var(--text-main); color: #fff; }
.disclaimer { text-align: center; font-size: 10px; font-weight: 400; color: var(--text-muted); margin-top: var(--sp-6); padding: 0 var(--sp-4); }

    </style>
  </head>
  <body>
    <div class="phone-shell">
      
      <header class="top-nav liquid-glass">
        <button class="brand" type="button">clarifin</button>
        <div class="next-event">NEXT: No major event</div>
        <div class="top-actions" aria-label="Header actions">
          <button class="top-action" id="search-button" type="button" aria-label="Search assets" title="Search assets">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
              <path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </button>
          <button class="avatar" id="avatar-button" type="button" aria-label="Open profile and settings">G</button>
        </div>
      </header>

      <main class="app-screen">
        <section class="screen list-screen" id="list-screen">
          <section class="greeting-section" id="screen-intro">
            <p class="date-label"></p>
            <h1></h1>
          </section>

          <section class="feed-section">
            <div class="tabs-container" id="event-tabs">
              <button class="event-tab active" data-event-mode="top" type="button">
                Top Events <span class="dot"></span>
              </button>

    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "") || "node";
}

function normalizeDirection(value) {
  const direction = String(value || "neutral").toLowerCase();
  if (["positive", "negative", "mixed", "neutral"].includes(direction)) return direction;
  if (["pos", "up", "bullish", "beneficiary"].includes(direction)) return "positive";
  if (["neg", "down", "bearish", "vulnerable"].includes(direction)) return "negative";
  return "mixed";
}

function getNodeTimeValue(node) {
  return firstValue(node, ["published_at", "publishedAt"], firstValue(node, ["created_at", "createdAt"], ""));
}

function getNodeTimeMs(node) {
  const time = new Date(getNodeTimeValue(node)).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function sortNodesNewestFirst(list) {
  return list.slice().sort((a, b) => getNodeTimeMs(b) - getNodeTimeMs(a));
}

function formatTimeAgo(value) {
  // Card timestamps are calculated at render time from published_at, falling back to created_at.
  const time = new Date(value).getTime();
  if (Number.isNaN(time)) return "now";
  const minutes = Math.floor(Math.max(0, Date.now() - time) / 60000);
  if (minutes < 1) return "now";
  if (minutes < 60) return `${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} h`;
  return `${Math.floor(hours / 24)} d`;
}

function getNodeTimeLabel(node) {
  return formatTimeAgo(getNodeTimeValue(node));
}

function normalizeChain(item) {
  if (typeof item === "string") {
    return { title: item, explanation: item, event: item, mechanism: "", sectorImpact: "", assetImpact: "", watch: "" };
  }
  const cleanChainText = (value) => String(value || "")
    .replace(/\bEvent:\s*/gi, "")
    .replace(/\bImpact:\s*/gi, "")
    .replace(/\bMechanism:\s*/gi, "")
    .replace(/\bWatch:\s*/gi, "")
    .replace(/\s+/g, " ")
    .trim();
  const sentence = (value) => {
    const text = cleanChainText(value);
    if (!text) return "";
    return /[.!?]$/.test(text) ? text : `${text}.`;
  };
  const event = firstValue(item, ["event", "trigger", "what_happened"], "");
  const mechanism = firstValue(item, ["mechanism", "why", "transmission"], "");
  const assetImpact = firstValue(item, ["assetImpact", "asset_impact", "assets"], "");
  const sectorImpact = firstValue(item, ["sectorImpact", "sector_impact", "impact"], "");
  const directExplanation = firstValue(item, ["explanation", "summary", "description", "paragraph"], "");
  const fallbackParts = [mechanism, assetImpact || sectorImpact].filter((part, index, arr) => {
    const text = cleanChainText(part).toLowerCase();
    return text && arr.findIndex((candidate) => cleanChainText(candidate).toLowerCase() === text) === index;
  });
  return {
    title: firstValue(item, ["title", "name", "chain_title"], "Causal chain"),
    explanation: directExplanation ? sentence(directExplanation) : (fallbackParts.map(sentence).join(" ") || sentence(event)),
    direction: normalizeDirection(firstValue(item, ["direction", "direction_hint"], "neutral")),
    timeHorizon: firstValue(item, ["time_horizon", "timeHorizon"], ""),
    event,
    mechanism,
    sectorImpact,
    assetImpact,
    watch: firstValue(item, ["watch", "watchlist", "watch_for"], "")
  };
}

function normalizeScenario(item) {
  if (typeof item === "string") return { title: "Scenario", body: item };
  return {
    title: firstValue(item, ["title", "name", "scenario"], "Scenario"),
    body: firstValue(item, ["body", "description", "text", "summary"], "")
  };
}

function normalizeAssetClass(value) {
  const normalized = String(value || "").trim().toLowerCase();
  const allowed = ["index", "bond", "commodity", "currency", "stock", "rate", "other"];
  return allowed.includes(normalized) ? normalized : "";
}

function formatLabel(value) {
  return String(value || "")
    .replace(/_/g, " ")
    .trim()
    .replace(/\b\w/g, (letter) => letter.toUpperCase());
}

function formatNameWithSymbol(primary, secondary, fallback = "") {
  const first = String(primary || "").trim();
  const second = String(secondary || "").trim();
  if (first && second && first.toUpperCase() !== second.toUpperCase()) return `${first} - ${second}`;
  return first || second || fallback;
}

function stripLeadingSymbolFromHeading(value, symbol) {
  const text = String(value || "").trim();
  const ticker = String(symbol || "").trim();
  if (!text || !ticker) return text;
  const escapedTicker = ticker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const cleaned = text.replace(new RegExp(`^${escapedTicker}\\s*[-:]?\\s+`, "i"), "").trim();
  return cleaned || text;
}

function formatIndirectImpactHeading(item) {
  const title = String(item?.title || "").trim();
  const companyName = String(item?.companyName || "").trim();
  const symbol = String(item?.symbol || "").trim();
  const preferred = stripLeadingSymbolFromHeading(companyName || title, symbol);
  if (preferred && preferred.toUpperCase() !== "INDIRECT IMPACT") return preferred;
  return symbol || preferred || "Indirect impact";
}

const OFFICIAL_SECTOR_ETFS = ["XLY", "XLP", "XLE", "XLF", "XLV", "XLI", "XLB", "XLRE", "XLK", "XLC", "XLU"];

function normalizeAsset(asset) {

function isValidatedAsset(asset) {
  const ticker = String(asset?.ticker || "").trim().toUpperCase();
  const name = String(asset?.name || "").trim().toUpperCase();
  if (!ticker || INVALID_ASSET_LABELS.has(ticker)) return false;
  if (SECTOR_ETF_PROXIES.has(ticker)) return false;
  if (BROAD_THEME_LABELS.has(ticker) || BROAD_THEME_LABELS.has(name)) return false;
  if (String(asset?.assetClass || "").trim().toLowerCase() === "etf") return false;
  return true;
}

function normalizeResearchExposure(exposure) {
  const sectorProxyTickers = toArray(firstValue(exposure, [

    directionHint: normalizeDirection(firstValue(exposure, ["direction_hint", "directionHint", "direction"], "mixed")),

function normalizeIndirectImpact(item) {
  const symbol = firstValue(item, ["symbol", "ticker", "canonical_asset"], "");
  const companyName = firstValue(item, ["company_name", "company", "name"], "");
  const rawDirection = firstValue(item, ["direction", "impact_direction", "sentiment"], "");
  const rawStrength = String(firstValue(item, ["strength"], "weak") || "weak").trim().toLowerCase();
  return {
    symbol,
    companyName,
    title: firstValue(item, ["title"], companyName || symbol || "Indirect impact"),
    direction: rawDirection ? normalizeDirection(rawDirection) : "",
    strength: ["weak", "medium", "high"].includes(rawStrength) ? rawStrength : "weak",
    reason: firstValue(item, ["reason", "watchlist_reason", "description"], ""),
    evidenceRequiredToUpgrade: firstValue(item, ["evidence_required_to_upgrade", "evidenceRequiredToUpgrade", "data_needed"], ""),
    sourceChannel: firstValue(item, ["source_channel", "category", "channel"], ""),
    sortOrder: toNumber(firstValue(item, ["sort_order", "sortOrder"], 0), 0)
  };
}

function getAppFacingIndirectImpacts(row, detail = {}) {
  const appFacingSections = parseJsonValue(firstValue(row, ["app_facing_sections", "appFacingSections"], firstValue(detail, ["app_facing_sections", "appFacingSections"], {}))) || {};
  const candidates = [
    firstValue(row, ["indirect_impact", "indirectImpact"], null),
    firstValue(detail, ["indirect_impact", "indirectImpact"], null),
    appFacingSections.indirect_impact || appFacingSections.indirectImpact || null
  ];
  for (const candidate of candidates) {
    const items = toArray(candidate)
      .map(normalizeIndirectImpact)
      .filter((item) => item.title && item.reason)
      .sort((a, b) => a.sortOrder - b.sortOrder);
    if (items.length) return items;
  }
  return [];
}

function assetIdentityTokens(asset) {
  return [
    asset?.ticker,
    asset?.symbol,
    asset?.name,
    asset?.companyName,
    asset?.title
  ]
    .map((value) => String(value || "").trim().toUpperCase())
    .filter(Boolean);
}

function filterDuplicateIndirectImpacts(indirectImpacts, directAssets) {
  const directTokens = new Set((Array.isArray(directAssets) ? directAssets : []).flatMap(assetIdentityTokens));
  const seen = new Set();
  return (Array.isArray(indirectImpacts) ? indirectImpacts : [])
    .filter((item) => {
      const tokens = assetIdentityTokens(item);
      if (!tokens.length || tokens.some((token) => directTokens.has(token))) return false;
      const key = tokens[0];
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

function normalizeObservationStatus(value) {
  const status = String(value || "skipped").trim().toLowerCase();
  const allowed = ["success", "partial_success", "skipped", "failed", "timeout", "rate_limited", "no_results"];
  return allowed.includes(status) ? status : "failed";
}

function aggregateObservationStatus(statuses) {
  const normalized = statuses.map(normalizeObservationStatus).filter(Boolean);
  if (!normalized.length) return "skipped";
  const unique = [...new Set(normalized)];
  if (unique.length === 1) return unique[0];
  if (unique.includes("success")) return "partial_success";
  if (unique.includes("rate_limited")) return "rate_limited";
  if (unique.includes("timeout")) return "timeout";
  if (unique.includes("failed")) return "failed";
  if (unique.includes("no_results")) return "no_results";
  return "skipped";
}

function compactObservationLabel(observation, facts) {
  const source = String(observation.sourceName || "").toUpperCase();
  const query = String(observation.queryOrEndpoint || "").trim();
  if (source === "FRED") {
    const seriesId = query.includes(":") ? query.split(":").pop() : "";
    return seriesId || facts.series_name || "FRED series";
  }
  if (source === "EIA") {
    const indicator = String(facts.indicator_name || "").toLowerCase();
    if (indicator.includes("brent")) return "Brent crude";
    if (indicator.includes("wti") || indicator.includes("cushing")) return "WTI crude";
    if (indicator.includes("henry hub")) return "Henry Hub gas";
    if (indicator.includes("field production of crude oil")) return "U.S. crude production";
    if (indicator.includes("crude oil stocks")) return "U.S. crude stocks";
    if (indicator.includes("gasoline stocks")) return "U.S. gasoline stocks";
    if (indicator.includes("distillate")) return "U.S. distillate stocks";
    return facts.indicator_name || "EIA indicator";
  }
  if (source === "ECB") return facts.indicator_name || query || "ECB series";
  if (source === "FMP") return facts.ticker || observation.queryOrEndpoint || facts.company_name || "FMP";
  if (source === "COINGECKO") return facts.symbol || facts.name || "Crypto market";
  if (source === "GDELT") return "Query";
  return query || source || "Observation";
}

function formatEvidenceValue(value, unit = "") {
  if (!hasValue(value)) return "";
  const number = Number(value);
  if (!Number.isFinite(number)) return String(value);
  if (unit === "MBBL/D" && Math.abs(number) >= 1000) return new Intl.NumberFormat("de-DE").format(number);
  return new Intl.NumberFormat("en-US", { maximumFractionDigits: 4 }).format(number);
}

function compactObservationLine(observation) {
  const source = String(observation.sourceName || "").toUpperCase();
  const status = normalizeObservationStatus(observation.status);
  const facts = observation.displayFacts || {};
  const warning = firstValue(observation.responseSummary, ["warning"], observation.warning || "");
  if (source === "GDELT") {
    const query = firstValue(facts, ["query"], observation.queryOrEndpoint || "");
    const count = firstValue(facts, ["headline_count", "headlineCount"], "");
    if (status !== "success") return warning || "External headline support unavailable.";
    return `${query ? `Query: ${query}. ` : ""}${hasValue(count) ? `Headlines: ${count}. ` : ""}Headlines are metadata only.`;
  }

  if (status !== "success") {
    return warning || `${compactObservationLabel(observation, facts)} unavailable.`;
  }

  if (source === "FMP") {
    const parts = [
      facts.company_name,
      facts.sector,
      facts.industry,
      hasValue(facts.earnings_date) ? `earnings ${facts.earnings_date}` : "",
      hasValue(facts.eps_estimate) ? `EPS est. ${formatFactualValue(facts.eps_estimate)}` : "",
      hasValue(facts.revenue_estimate) ? `revenue est. ${formatFactualValue(facts.revenue_estimate)}` : "",
      hasValue(facts.market_cap) ? `market cap ${formatFactualValue(facts.market_cap)}` : ""
    ].filter(Boolean);
    return `${compactObservationLabel(observation, facts)}: ${parts.join(" - ") || "company context available"}`;
  }

  const label = compactObservationLabel(observation, facts);
  const latestValue = firstValue(facts, ["latest_value", "latestValue"], "");
  const latestDate = firstValue(facts, ["latest_date", "latestDate"], "");
  const unit = firstValue(facts, ["unit"], "");
  const change = firstValue(facts, ["change_from_previous", "changeFromPrevious"], "");
  const valueText = hasValue(latestValue) ? `${formatEvidenceValue(latestValue, unit)}${unit ? ` ${unit}` : ""}` : "";
  const dateText = latestDate ? ` on ${latestDate}` : "";
  const changeText = hasValue(change) ? `; change ${formatEvidenceValue(change, unit)}` : "";
  return `${label}: ${valueText || "latest value available"}${dateText}${changeText}`;
}

function normalizeExternalObservation(item) {
  const displayFacts = parseJsonValue(firstValue(item, ["display_facts", "displayFacts"], {})) || {};
  const responseSummary = parseJsonValue(firstValue(item, ["response_summary", "responseSummary"], {})) || {};
  return {
    sourceName: String(firstValue(item, ["source_name", "sourceName"], "") || "").toUpperCase(),
    sourceType: firstValue(item, ["source_type", "sourceType"], ""),
    queryOrEndpoint: firstValue(item, ["query_or_endpoint", "queryOrEndpoint"], ""),
    status: normalizeObservationStatus(firstValue(item, ["status"], "")),
    dataQuality: firstValue(item, ["data_quality", "dataQuality"], "unknown"),
    displayFacts,
    responseSummary,
    interpretationNote: firstValue(item, ["interpretation_note", "interpretationNote"], ""),
    warning: firstValue(item, ["warning"], "")
  };
}

function normalizeResearchEvidence(factPackRows) {
  const factPack = factPackRows[0] || {};
  const observations = toArray(firstValue(factPack, ["external_data_observations", "externalDataObservations"], []))
    .map(normalizeExternalObservation)
    .filter((item) => item.sourceName);
  const missingData = uniqueStrings([
    ...toArray(firstValue(factPack, ["missing_data", "missingData"], [])),
    ...toArray(firstValue(factPack, ["research_warnings", "researchWarnings"], [])),
    ...observations
      .filter((item) => item.status !== "success")
      .map((item) => compactObservationLine(item))
  ].map((item) => String(item || "").trim()).filter(Boolean));

  const grouped = observations.reduce((groups, item) => {
    if (!groups[item.sourceName]) groups[item.sourceName] = [];
    groups[item.sourceName].push(item);
    return groups;
  }, {});

  return {
    sources: Object.entries(grouped).map(([sourceName, items]) => ({
      sourceName,
      status: aggregateObservationStatus(items.map((item) => item.status)),
      facts: items.map(compactObservationLine).filter(Boolean).slice(0, 5),
      metadataOnly: sourceName === "GDELT"
    })),
    missingData: missingData.slice(0, 6)
  };
}

function hasResearchEvidence(evidence) {
  return Boolean(evidence && ((Array.isArray(evidence.sources) && evidence.sources.length) || (Array.isArray(evidence.missingData) && evidence.missingData.length)));
}

function uniqueStrings(values) {
  return [...new Set(values.map((value) => String(value || "").trim()).filter(Boolean))];
}

function getExposureSectorEtfs(exposure) {

    .map((ticker) => String(ticker || "").trim().toUpperCase())

  }

  const text = [
    exposure?.theme,

  ].map((value) => String(value || "").toLowerCase()).join(" ");
  const mappings = [
    ["XLY", ["consumer discretionary", "travel", "tourism", "cruise", "luxury", "leisure", "hotel", "restaurant", "retail", "autos"]],
    ["XLP", ["consumer staples", "staples", "grocer", "food", "beverage", "household products", "personal care"]],
    ["XLE", ["energy", "oil", "crude", "gas", "lng", "fuel", "refinery", "pipeline"]],
    ["XLF", ["financial", "bank", "banks", "insurance", "broker", "credit", "lender", "lending", "payments"]],
    ["XLV", ["healthcare", "health care", "pharma", "biotech", "medical", "hospital", "drugmaker"]],
    ["XLI", ["industrial", "industrials", "defense", "defence", "aerospace", "machinery", "infrastructure", "manufacturing"]],
    ["XLB", ["materials", "mining", "metals", "chemicals", "steel", "copper", "lithium"]],
    ["XLRE", ["real estate", "reit", "property", "housing", "refinancing"]],
    ["XLK", ["technology", "technology sector", "software", "semiconductor", "semiconductors", "chips", "cloud", "data center", "data centers", "security budget", "security spending", "cybersecurity spending"]],
    ["XLC", ["communication services", "telecom", "media", "advertising", "streaming", "social media"]],
    ["XLU", ["utilities", "utility", "electricity", "power grid", "grid", "renewables", "water utility"]],

  return mappings
    .filter(([, terms]) => terms.some((term) => text.includes(term)))

}

function relatedNodeId(row, allowOwnId = false) {
  const value = firstValue(row, ["node_id", "nodeId", "node", "clarifin_node_id", "parent_node_id"], allowOwnId ? firstValue(row, ["id"], "") : "");
  return value ? String(value) : "";
}

function nodeLookupKey(value) {
  return String(value || "").trim().toLowerCase();
}

function groupByNodeId(rows, allowOwnId = false) {
  return rows.reduce((groups, row) => {
    const nodeId = nodeLookupKey(relatedNodeId(row, allowOwnId));
    if (!nodeId) return groups;
    if (!groups[nodeId]) groups[nodeId] = [];
    groups[nodeId].push(row);
    return groups;
  }, {});
}

async function supabaseFetch(path) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: SUPABASE_HEADERS
  });
  if (!response.ok) {
    const body = await response.text();
    throw new Error(`Supabase request failed: ${response.status} ${body}`);
  }
  return response.json();
}

async function fetchRelatedRows(tableName, nodeIds, selectColumns = "*") {
  if (!nodeIds.length) return [];
  const nodeKeys = nodeIds.map(nodeLookupKey).filter(Boolean);
  const encodedIds = nodeIds.map((id) => encodeURIComponent(id)).join(",");
  for (const column of ["node_id", "nodeId", "node", "clarifin_node_id"]) {
    try {
      const rows = await supabaseFetch(`${tableName}?select=${encodeURIComponent(selectColumns)}&${column}=in.(${encodedIds})`);
      return rows.filter((row) => nodeKeys.includes(nodeLookupKey(relatedNodeId(row, tableName === "node_details"))));
    } catch (error) {
      console.warn(`Clarifin Supabase: ${tableName} lookup by ${column} failed.`, error);
    }
  }
  try {
    const rows = await supabaseFetch(`${tableName}?select=${encodeURIComponent(selectColumns)}`);
    return rows.filter((row) => nodeKeys.includes(nodeLookupKey(relatedNodeId(row, tableName === "node_details"))));
  } catch (error) {
    console.warn(`Clarifin Supabase: ${tableName} unavailable.`, error);
    return [];
  }
}

async function loadResearchExposuresForNode(nodeId) {
  const exposureRows = await fetchRelatedRows("node_research_exposures", [nodeId]);
  if (!exposureRows.length) {
    console.warn("Clarifin Supabase: no node_research_exposures rows returned for selected node.", { nodeId });
    return [];
  }
  return exposureRows
    .map(normalizeResearchExposure)
    .filter((exposure) => exposure.theme || exposure.whyRelevant || exposure.sectorProxyTickers.length || exposure.dataNeeded || exposure.timeHorizon);
}

async function loadIndirectImpactsForNode(nodeId) {
  const impactRows = await fetchRelatedRows("node_indirect_impacts", [nodeId]);
  return impactRows
    .map(normalizeIndirectImpact)
    .filter((item) => item.title && item.reason)
    .sort((a, b) => a.sortOrder - b.sortOrder);
}

async function loadResearchEvidenceForNode(nodeId) {
  const factPackRows = await fetchRelatedRows(
    "research_fact_packs",
    [nodeId],
    "node_id,external_data_observations,missing_data,research_warnings"
  );
  return normalizeResearchEvidence(factPackRows);
}

function convertSupabaseNode(row, assetRows, detailRows, exposureRows = [], indirectImpactRows = [], researchFactPackRows = []) {
  const detail = detailRows[0] || {};
  const title = firstValue(row, ["title", "headline", "name"], "Untitled node");
  const id = String(firstValue(row, ["id", "slug"], slugify(title)));
  const chains = toArray(firstValue(detail, ["chains", "causal_chain", "causal_chains", "causalChains"], firstValue(row, ["chains", "causal_chains"], []))).map(normalizeChain);
  const scenarios = toArray(firstValue(detail, ["scenarios"], firstValue(row, ["scenarios"], []))).map(normalizeScenario);
  const counterarguments = toArray(firstValue(detail, ["counterarguments", "counter_arguments", "counters"], firstValue(row, ["counterarguments", "counter_arguments"], []))).map((item) => typeof item === "string" ? item : firstValue(item, ["body", "text", "argument"], ""));
  const sources = toArray(firstValue(detail, ["sources"], firstValue(row, ["sources"], []))).map((item) => typeof item === "string" ? item : firstValue(item, ["name", "title", "url"], ""));
  const impact = toNumber(firstValue(row, ["impact", "impact_score", "impactScore"], 50), 50);
  const confidence = toNumber(firstValue(row, ["confidence", "confidence_score", "confidenceScore"], 50), 50);
  const affectedAssets = assetRows.map(normalizeAsset).filter(isValidatedAsset);
  const persistedIndirectImpacts = indirectImpactRows
    .map(normalizeIndirectImpact)
    .filter((item) => item.title && item.reason)
    .sort((a, b) => a.sortOrder - b.sortOrder);
  const appFacingIndirectImpacts = persistedIndirectImpacts.length ? [] : getAppFacingIndirectImpacts(row, detail);
  const indirectImpacts = filterDuplicateIndirectImpacts(
    persistedIndirectImpacts.length ? persistedIndirectImpacts : appFacingIndirectImpacts,
    affectedAssets
  );

  return {
    id,
    status: firstValue(row, ["status"], "published"),
    category: firstValue(row, ["category", "topic", "type"], "Market Event"),
    eventType: firstValue(row, ["event_type", "eventType"], ""),
    eventStatus: firstValue(row, ["event_status", "eventStatus"], ""),
    title,
    short: firstValue(row, ["short", "summary", "subtitle", "description"], firstValue(detail, ["summary", "short"], "No summary available yet.")),
    impact,
    impactLabel: firstValue(row, ["impactLabel", "impact_label"], getImpactLabel(impact)),
    confidence,
    confidenceLabel: firstValue(row, ["confidenceLabel", "confidence_label"], getImpactLabel(confidence)),
    region: firstValue(row, ["region", "market", "geography"], "global"),
    published_at: firstValue(row, ["published_at", "publishedAt"], firstValue(row, ["created_at", "createdAt"], "")),
    created_at: firstValue(row, ["created_at", "createdAt"], ""),
    whyMatters: firstValue(detail, ["whyMatters", "why_matters", "why_it_matters"], firstValue(row, ["whyMatters", "why_matters", "why_it_matters"], "No deeper explanation available yet.")),
    chains,
    affectedAssets,
    indirectImpacts,
    researchEvidence: normalizeResearchEvidence(researchFactPackRows),
    researchExposures: exposureRows.map(normalizeResearchExposure).filter((exposure) => exposure.theme || exposure.whyRelevant || exposure.sectorProxyTickers.length || exposure.dataNeeded || exposure.timeHorizon),
    exposuresToWatch: exposureRows.map(normalizeResearchExposure).filter((exposure) => exposure.theme || exposure.whyRelevant || exposure.sectorProxyTickers.length || exposure.dataNeeded || exposure.timeHorizon),
    isSupabaseNode: true,
    exposuresLoaded: exposureRows.length > 0,
    indirectImpactsLoaded: indirectImpactRows.length > 0 || appFacingIndirectImpacts.length > 0,
    researchEvidenceLoaded: researchFactPackRows.length > 0,
    scenarios: scenarios.filter((scenario) => scenario.title || scenario.body),
    counterarguments: counterarguments.filter(Boolean),
    sources: sources.filter(Boolean)
  };
}

async function hydrateSupabaseNodes(rows) {
  const nodeIds = rows
    .map((row) => firstValue(row, ["id", "slug"], ""))
    .filter(Boolean)
    .map(String);
  const [assetRows, detailRows, exposureRows, indirectImpactRows, researchFactPackRows] = await Promise.all([
    fetchRelatedRows("affected_assets", nodeIds),
    fetchRelatedRows("node_details", nodeIds),
    fetchRelatedRows("node_research_exposures", nodeIds),
    fetchRelatedRows("node_indirect_impacts", nodeIds),
    fetchRelatedRows("research_fact_packs", nodeIds, "node_id,external_data_observations,missing_data,research_warnings")
  ]);
  const assetsByNode = groupByNodeId(assetRows);
  const detailsByNode = groupByNodeId(detailRows, true);
  const exposuresByNode = groupByNodeId(exposureRows);
  const indirectImpactsByNode = groupByNodeId(indirectImpactRows);
  const researchFactPacksByNode = groupByNodeId(researchFactPackRows);

  return sortNodesNewestFirst(rows.map((row) => {
    const nodeId = String(firstValue(row, ["id", "slug"], ""));
    const nodeKey = nodeLookupKey(nodeId);
    return convertSupabaseNode(
      row,
      assetsByNode[nodeKey] || [],
      detailsByNode[nodeKey] || [],
      exposuresByNode[nodeKey] || [],
      indirectImpactsByNode[nodeKey] || [],
      researchFactPacksByNode[nodeKey] || []
    );
  }));
}

function promptForReviewAdminToken(message = "Enter review admin token") {
  let token = window.prompt(message) || "";
  token = token.trim();
  if (token) localStorage.setItem(REVIEW_TOKEN_STORAGE_KEY, token);
  return token;
}

function getReviewAdminToken() {
  const token = localStorage.getItem(REVIEW_TOKEN_STORAGE_KEY) || "";
  return token || promptForReviewAdminToken();
}

function changeReviewAdminToken() {
  localStorage.removeItem(REVIEW_TOKEN_STORAGE_KEY);
  const token = promptForReviewAdminToken("Enter review admin token");
  reviewLoadMessage = token ? "" : "Review token is required to load draft nodes.";
  refreshReviewData();
}

async function callReviewNodeAction(payload) {
  const token = getReviewAdminToken();
  if (!token) {
    throw new Error("Review token is required to load draft nodes.");
  }

  const response = await fetch(`${SUPABASE_URL}/functions/v1/review-node-action`, {
    method: "POST",
    headers: {
      ...SUPABASE_HEADERS,
      "x-review-admin-token": token,
    },
    body: JSON.stringify(payload),
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (response.status === 401) localStorage.removeItem(REVIEW_TOKEN_STORAGE_KEY);
    throw new Error(body.error || `Review action failed: ${response.status}`);
  }
  return body;
}

async function callAutoPipelineAction(payload) {
  const token = getReviewAdminToken();
  if (!token) {
    throw new Error("Review token is required to run the auto pipeline.");
  }

  const response = await fetch(`${SUPABASE_URL}/functions/v1/auto-event-pipeline`, {
    method: "POST",
    headers: {
      ...SUPABASE_HEADERS,
      "x-review-admin-token": token,
    },
    body: JSON.stringify(payload),
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (response.status === 401) localStorage.removeItem(REVIEW_TOKEN_STORAGE_KEY);
    throw new Error(body.error || `Auto pipeline action failed: ${response.status}`);
  }
  return body;
}

    fiscalDateEnding: firstValue(row, ["fiscal_date_ending", "fiscalDateEnding"], "") || firstValue(calendarPayload, ["fiscalDateEnding", "fiscal_date_ending"], ""),
    status: firstValue(row, ["status"], "candidate"),

  try {

      reviewLoadMessage = error instanceof Error ? error.message : "Event candidates could not be loaded.";
    }

async function updateNodeReviewStatus(node, nextStatus) {
  if (!node?.id) return;
  const label = nextStatus === "published" ? "publish" : "archive";
  const confirmed = window.confirm(`Confirm ${label} for this draft node?`);
  if (!confirmed) return;

  try {
    const result = await callReviewNodeAction({
      action: nextStatus === "published" ? "publish" : "archive",
      node_id: node.id,
    });
    const updated = result.node || { ...node, status: nextStatus };
    const updatedNode = convertSupabaseNode(
      updated,
      node.affectedAssets || [],
      [],
      node.researchExposures || [],
      node.indirectImpacts || [],
      []
    );
    updatedNode.whyMatters = node.whyMatters;
    updatedNode.chains = node.chains;
    updatedNode.scenarios = node.scenarios;
    updatedNode.counterarguments = node.counterarguments;
    updatedNode.sources = node.sources;
    updatedNode.researchEvidence = node.researchEvidence;

    draftNodes = draftNodes.filter((item) => item.id !== node.id);
    if (nextStatus === "published") {
      nodes = sortNodesNewestFirst([updatedNode, ...nodes.filter((item) => item.id !== node.id)]);
    }
    selectedNodeId = null;
    renderList();
  } catch (error) {
    console.warn("Clarifin review status update failed.", error);
    window.alert(error instanceof Error ? error.message : "Status update failed.");
  }
}

function countResultItems(value) {
  if (Array.isArray(value)) return value.length;
  const numeric = Number(value || 0);
  return Number.isFinite(numeric) ? numeric : 0;
}

function pipelineSummary(result) {
  const warnings = Array.isArray(result.warnings) ? result.warnings.length : countResultItems(result.warnings);
  const errors = Array.isArray(result.errors) ? result.errors.length : countResultItems(result.errors);
  const duplicatedOrSkipped =
    countResultItems(result.candidates_duplicates)
    + countResultItems(result.candidates_updated)
    + countResultItems(result.candidates_skipped);
  return [
    `candidates created: ${countResultItems(result.candidates_created)}`,
    `candidates duplicated/skipped: ${duplicatedOrSkipped}`,
    `nodes generated: ${countResultItems(result.nodes_generated)}`,
    `nodes auto-published: ${countResultItems(result.nodes_auto_published)}`,
    `nodes left as draft: ${countResultItems(result.nodes_left_as_draft)}`,
    `warnings: ${warnings}`,
    errors ? `errors: ${errors}` : "",
  ].filter(Boolean).join(" - ");
}

function pipelineResultNotice(result) {
  const candidatesCreated = countResultItems(result.candidates_created);
  const nodesGenerated = countResultItems(result.nodes_generated);
  const summary = `Pipeline complete: ${pipelineSummary(result)}.`;
  if (candidatesCreated > 0 && nodesGenerated === 0) {
    const candidateText = candidatesCreated === 1 ? "1 candidate created" : `${candidatesCreated} candidates created`;
    const actionText = candidatesCreated === 1
      ? "Open the Candidates tab to review it."
      : "Open the Candidates tab to review them.";
    return `${candidateText}. ${actionText} ${summary}`;
  }
  return summary;
}

async function refreshReviewData() {
  await Promise.all([
    loadDraftNodes(),
    loadEventCandidates(),
    loadPublishedNodes(),
    loadUpcomingEvents(),
  ]);
}

async function runAutoPipeline() {
  const confirmed = window.confirm("Run the auto event pipeline now? This may create draft nodes and can auto-publish candidates that pass safeguards.");
  if (!confirmed) return;
  pipelineResultMessage = "Auto pipeline running...";
  renderList();
  try {
    const result = await callAutoPipelineAction({ action: "run_once" });
    const candidatesCreated = countResultItems(result.candidates_created);
    const nodesGenerated = countResultItems(result.nodes_generated);
    if (candidatesCreated > 0 && nodesGenerated === 0) {
      reviewTab = "candidates";
    }
    pipelineResultMessage = pipelineResultNotice(result);
    reviewLoadMessage = "";
    await refreshReviewData();
  } catch (error) {
    console.warn("Clarifin auto pipeline failed.", error);
    pipelineResultMessage = error instanceof Error ? error.message : "Auto pipeline failed.";
    renderList();
  }
}

async function runCandidateAction(action, candidateId) {
  if (!candidateId) return;
  const actionLabel = {
    generate: "generate a node from this candidate",
    publish: "publish this generated candidate node",
    ignore: "ignore this candidate",
    archive: "archive this candidate",
  }[action] || action;
  const needsConfirm = ["generate", "publish"].includes(action);
  if (needsConfirm && !window.confirm(`Confirm: ${actionLabel}?`)) return;

  const actionMap = {
    generate: "generate_candidate",
    publish: "publish_candidate_node",
    ignore: "ignore_candidate",
    archive: "archive_candidate",
  };
  try {
    const result = await callAutoPipelineAction({
      action: actionMap[action],
      candidate_id: candidateId,
    });
    pipelineResultMessage = result.generated_nodes_summary
      ? `Candidate action complete: ${result.generated_nodes_summary.length} node result(s).`
      : `Candidate action complete: ${formatLabel(action)}.`;
    reviewLoadMessage = "";
    await refreshReviewData();
  } catch (error) {
    console.warn("Clarifin candidate action failed.", error);
    pipelineResultMessage = error instanceof Error ? error.message : "Candidate action failed.";
    renderList();
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function normalizeSearchToken(value) {
  return String(value || "").trim().toLowerCase();
}

function assetSearchText(asset) {
  return [
    asset.symbol,
    asset.name,
    asset.asset_type,
    asset.sector,
    asset.region,
    ...(Array.isArray(asset.themes) ? asset.themes : []),
    ...(Array.isArray(asset.event_families) ? asset.event_families : []),
    ...(Array.isArray(asset.aliases) ? asset.aliases : [])
  ].map(normalizeSearchToken).join(" ");
}

function getAssetBySymbol(symbol) {
  const normalized = normalizeWatchlistSymbol(symbol);
  return LOCAL_ASSET_CATALOG.find((asset) => normalizeWatchlistSymbol(asset.symbol) === normalized);
}

function getAssetWatchlistTokens(asset) {
  return [asset?.symbol, asset?.name, ...(Array.isArray(asset?.aliases) ? asset.aliases : [])]
    .map(normalizeWatchlistSymbol)
    .filter(Boolean);
}

function isAssetInWatchlist(asset) {
  const tokens = new Set(getAssetWatchlistTokens(asset));
  return watchlist.some((item) => tokens.has(normalizeWatchlistSymbol(item)));
}

function addAssetToWatchlist(asset) {
  if (!asset || isAssetInWatchlist(asset)) return;
  saveWatchlistSymbols([...watchlist, asset.symbol]);
}

function removeAssetFromWatchlist(asset) {
  if (!asset) return;
  const tokens = new Set(getAssetWatchlistTokens(asset));
  saveWatchlistSymbols(watchlist.filter((item) => !tokens.has(normalizeWatchlistSymbol(item))));
}

function mergeAssetSymbolsIntoWatchlist(symbols) {
  const nextSymbols = watchlist.slice();
  symbols.forEach((symbol) => {
    const asset = getAssetBySymbol(symbol);
    if (!asset) return;
    const tokens = new Set(getAssetWatchlistTokens(asset));
    const alreadyPresent = nextSymbols.some((item) => tokens.has(normalizeWatchlistSymbol(item)));
    if (!alreadyPresent) nextSymbols.push(asset.symbol);
  });
  saveWatchlistSymbols(nextSymbols);
}

function getDiscoverResults() {
  const query = normalizeSearchToken(discoverQuery);
  const results = query
    ? LOCAL_ASSET_CATALOG.filter((asset) => assetSearchText(asset).includes(query))

  }

  watchlistMessage = `${symbol} added to your watchlist.`;

function getCurrentDateLabel() {
  // The Home date uses the user's device date every time the app loads.
  const now = new Date();
  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  const day = now.getDate();
  const month = now.toLocaleDateString("en-US", { month: "long" });
  return `${weekday}, ${day} ${month}`;
}

function getGreeting() {
  // The greeting follows the user's local device time.
  const hour = new Date().getHours();
  const displayName = getDisplayName();
  if (hour >= 3 && hour <= 10) return `Good morning, ${displayName}`;
  if (hour >= 17 && hour <= 21) return `Good evening, ${displayName}`;
  return `Welcome, ${displayName}`;
}

function getSortedUpcomingEvents() {
  return upcomingEvents
    .slice()
    .sort((a, b) => new Date(a.datetime).getTime() - new Date(b.datetime).getTime());
}

function isSameCalendarDay(firstDate, secondDate) {
  return firstDate.getFullYear() === secondDate.getFullYear()
    && firstDate.getMonth() === secondDate.getMonth()
    && firstDate.getDate() === secondDate.getDate();
}

function formatShortDate(date) {
  const day = date.getDate();
  const month = date.toLocaleDateString("en-US", { month: "short" });
  return `${day} ${month}`;
}

function formatUpcomingTime(dateString) {
  // The top header shows the next event using short relative time labels.
  const eventDate = new Date(dateString);
  if (Number.isNaN(eventDate.getTime())) return "";

  const now = new Date();
  const diffMs = eventDate.getTime() - now.getTime();
  if (diffMs <= 0) return "now";

  const minutes = Math.ceil(diffMs / 60000);
  if (minutes < 60) return `in ${minutes} min`;

  const hours = Math.ceil(minutes / 60);
  if (hours < 24) return `in ${hours}h`;

  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  if (isSameCalendarDay(eventDate, tomorrow)) return "tomorrow";

  const days = Math.ceil(diffMs / (24 * 60 * 60 * 1000));
  if (days < 7) return `in ${days}d`;

  return formatShortDate(eventDate);
}

function formatUpcomingCardTimestamp(dateString) {
  const eventDate = new Date(dateString);
  if (Number.isNaN(eventDate.getTime())) return "";
  const time = eventDate.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);

  if (isSameCalendarDay(eventDate, tomorrow)) return `tomorrow, ${time}`;
  return `${formatShortDate(eventDate)}, ${time}`;
}

function getUpcomingTimeLabel(dateString) {
  const eventDate = new Date(dateString);
  if (Number.isNaN(eventDate.getTime())) return "";
  return eventDate.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

function getNextUpcomingEvent() {
  // Find the first future event after sorting all upcoming events by datetime.
  const now = Date.now();
  return getSortedUpcomingEvents().find((event) => {
    const eventTime = new Date(event.datetime).getTime();
    return Number.isFinite(eventTime) && eventTime > now;
  });
}

function updateTopHeader() {
  if (activeView === "review") {
    nextEventLabel.textContent = "REVIEW: Draft queue";

    nextEventLabel.textContent = "NEXT: No major event";
    return;
  }

  nextEventLabel.textContent = `NEXT: ${label} ${formatUpcomingTime(nextEvent.datetime)}`;

function getTickers(node) {
  const preferredOrder = ["USO", "GLD", "TLT", "SPY", "QQQ", "BND", "BRENT CRUDE", "WTI CRUDE", "DXY"];
  const priority = (ticker) => {
    const index = preferredOrder.indexOf(String(ticker || "").trim().toUpperCase());
    return index === -1 ? 99 : index;
  };
  return (Array.isArray(node.affectedAssets) ? node.affectedAssets : [])
    .filter(isValidatedAsset)
    .slice()
    .sort((a, b) => priority(a.ticker) - priority(b.ticker) || directionOrder[a.direction] - directionOrder[b.direction])
    .slice(0, 3)
    .map((asset) => ({ ticker: asset.ticker, direction: asset.direction }));
}

function getRegionFlag(region) {

    normalized === "united states" ||
    normalized === "america" ||

    normalized === "eurozone" ||
    normalized === "ecb" ||

}

function isFocusableElementVisible(element) {
  if (!element || element.disabled || element.tabIndex === -1) return false;
  if (element.closest("[hidden]")) return false;
  const style = window.getComputedStyle(element);
  if (style.visibility === "hidden" || style.display === "none") return false;
  return Boolean(element.offsetParent || element.getClientRects().length);
}

function getOnboardingFocusableElements() {
  const dialog = getOnboardingDialog();
  if (!dialog) return [];
  return Array.from(dialog.querySelectorAll("button, input, select, textarea, a[href], [tabindex]"))
    .filter(isFocusableElementVisible);
}

function setOnboardingBackgroundInert(enabled) {
  [document.querySelector(".top-nav"), appScreen, bottomNav].forEach((element) => {
    if (!element) return;
    if (enabled) {
      if (!element.hasAttribute("inert")) element.dataset.onboardingManagedInert = "true";
      element.inert = true;
    } else if (element.dataset.onboardingManagedInert === "true") {
      element.inert = false;
      delete element.dataset.onboardingManagedInert;
    }
  });
}

function rememberOnboardingFocus() {
  const active = document.activeElement;
  onboardingPreviouslyFocusedElement = active
    && active !== document.body
    && !onboardingOverlay?.contains(active)
    ? active
    : null;
}

function focusOnboardingStep() {
  if (!isOnboardingVisible()) return;
  const dialog = getOnboardingDialog();
  if (!dialog) return;
  const preferred = dialog.querySelector("[data-onboarding-toggle]")
    || dialog.querySelector('[data-onboarding-action="next"], [data-onboarding-action="finish"]')
    || getOnboardingFocusableElements()[0]
    || dialog;
  window.setTimeout(() => preferred.focus(), 0);
}

function restoreOnboardingFocus() {
  const fallback = avatarButton || searchButton || brandButton;
  const target = onboardingPreviouslyFocusedElement
    && document.contains(onboardingPreviouslyFocusedElement)
    && !onboardingPreviouslyFocusedElement.closest("[inert]")
    ? onboardingPreviouslyFocusedElement
    : fallback;
  onboardingPreviouslyFocusedElement = null;
  window.setTimeout(() => target?.focus?.(), 0);
}

function handleOnboardingKeydown(event) {
  if (!isOnboardingVisible() || event.key !== "Tab") return;
  const dialog = getOnboardingDialog();
  if (!dialog) return;
  const focusable = getOnboardingFocusableElements();
  if (!focusable.length) {
    event.preventDefault();
    dialog.focus();
    return;
  }
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (!dialog.contains(document.activeElement)) {
    event.preventDefault();
    (event.shiftKey ? last : first).focus();
    return;
  }
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

    renderList();
  } else if (action === "saved") {
    activeView = "saved";
    localScreenMessage = "";
    renderList();
  } else if (action === "restart-onboarding") {
    startOnboarding();
  } else if (["settings", "help", "inbox"].includes(action)) {
    openLocalView(action);
  }
}

function formatCandidateNumber(value, options = {}) {
  if (value === "" || value === null || value === undefined) return "";
  const number = Number(value);
  if (!Number.isFinite(number)) return String(value);
  return number.toLocaleString("en-US", options);
}

function renderCandidateFacts(candidate) {
  const facts = [];
  if (candidate.displayBucket) facts.push(["Bucket", formatLabel(candidate.displayBucket)]);
  if (candidate.ticker) facts.push(["Ticker", candidate.ticker]);
  if (candidate.companyName) facts.push(["Company", candidate.companyName]);
  if (candidate.earningsDate) facts.push(["Date", candidate.earningsDate]);
  if (candidate.epsEstimate !== "") facts.push(["EPS est.", formatCandidateNumber(candidate.epsEstimate, { maximumFractionDigits: 2 })]);
  if (candidate.revenueEstimate !== "") facts.push(["Revenue est.", formatCandidateNumber(candidate.revenueEstimate, { notation: "compact", maximumFractionDigits: 2 })]);
  if (candidate.sourceName) facts.push(["Source", candidate.sourceName]);
  if (candidate.marketImportanceScore) facts.push(["Market importance", Math.round(candidate.marketImportanceScore)]);
  if (!facts.length) return "";
  return `
    <div class="candidate-facts">
      ${facts.map(([label, value]) => `<span class="candidate-fact">${escapeHtml(label)} <strong>${escapeHtml(value)}</strong></span>`).join("")}
    </div>
  `;
}

function isEarningsEvent(event) {
  return String(event.category || "").toLowerCase() === "earnings";
}

function getPrimaryUpcomingTicker(event) {
  const watchItems = Array.isArray(event.watch) ? event.watch : [];
  const ticker = watchItems[0] || String(event.title || "").split(" ")[0];
  return String(ticker || "").trim().toUpperCase();
}

function getUpcomingEventDescription(event) {
  if (!isEarningsEvent(event)) {
    const title = String(event.title || "").toLowerCase();
    const category = String(event.category || "").toLowerCase();
    const rawShort = String(event.short || "").trim();

    if (title.includes("cpi")) {
      return "Inflation data can reset rate-cut expectations and move yields, growth stocks and the dollar. Watch headline CPI, core CPI and shelter inflation.";
    }

    if (title.includes("fed") && (title.includes("interest") || title.includes("rate") || title.includes("decision"))) {
      return "The Fed decision can shift rate expectations, bond yields, equity valuations and the dollar. Watch the statement, dot plot and Powell's press conference.";
    }

    if (title.includes("ecb") && (title.includes("interest") || title.includes("rate") || title.includes("decision"))) {
      return "The ECB decision can move European banks, real estate, bonds and EUR/USD. Watch inflation language, growth concerns and guidance on future cuts.";
    }

    if (category.includes("macro") || category.includes("central bank")) {
      return "This scheduled macro event may affect rates, currencies, equities and risk appetite depending on the outcome versus expectations.";
    }

    if (!rawShort || rawShort.toLowerCase() === "manual entry") return "Scheduled market event.";
    return rawShort;
  }

  const ticker = getPrimaryUpcomingTicker(event);
  const descriptions = {
    COST: "Costco reports earnings. Watch consumer demand, membership trends, margins and retail read-throughs.",
    ADBE: "Adobe reports earnings. Watch AI monetization, subscription growth, margins and creative software demand.",
    NKE: "Nike reports earnings. Watch China demand, inventory levels, margins and consumer spending signals.",
    FDX: "FedEx reports earnings. Watch shipping volumes, pricing, margins and global trade demand.",
    DOCU: "DocuSign reports earnings. Watch subscription growth, retention, margins and enterprise software demand.",
    CCL: "Carnival reports earnings. Watch booking trends, pricing, debt reduction and travel demand."
  };

  return descriptions[ticker] || `${ticker || "Company"} reports earnings. Watch guidance, margins, revenue growth and sector read-throughs.`;
}

function getUpcomingImportance(event) {
  const score = Number(event.importance);
  return Number.isFinite(score) && score > 0 ? Math.round(score) : null;
}

function renderUpcomingCards(noticeHTML = "") {
  const events = getSortedUpcomingEvents();
  if (!events.length) {
    eventList.innerHTML = `
      ${noticeHTML}
      <article class="event-card liquid-glass">
        <h2>No upcoming events yet</h2>
        <p>Scheduled market events will appear here when available.</p>
      </article>
    `;
    return;
  }

  eventList.innerHTML = noticeHTML + events
    .map((event, index) => {
      const earnings = isEarningsEvent(event);
      const importance = earnings ? null : getUpcomingImportance(event);
      const watchItems = Array.isArray(event.watch) ? event.watch : [];

      return `
        <button class="event-card upcoming-card liquid-glass" data-upcoming-index="${index}" type="button">
          <div class="card-header">
            <span class="category-pill">${escapeHtml(event.category)}</span>
            <img src="${event.region ? getRegionFlag(event.region) : getUpcomingFlag(event.title)}" class="region-flag" alt="Region" onerror="this.style.display='none'" />
          </div>
          <h2>${escapeHtml(event.title)}</h2>
          <p>${escapeHtml(getUpcomingEventDescription(event))}</p>
          ${!earnings && importance ? `
            <div class="card-meta">
              <span class="score-pill yellow">${importance}</span>
            </div>
          ` : ""}
          ${watchItems.length ? `
            <div class="ticker-row">
              ${watchItems.map((item) => `<span class="ticker-chip neutral">${escapeHtml(item)}</span>`).join("")}
            </div>
          ` : ""}
          <span class="timestamp">${escapeHtml(formatUpcomingCardTimestamp(event.datetime))}</span>
        </button>
      `;
    })
    .join("");
}

function renderList() {
  selectedNodeId = null;
  listScreen.hidden = false;
  detailScreen.hidden = true;
  ensureBottomNavVisible();
  scrollAppToTop();
  setActiveNav(activeView);
  renderIntro();
  updateTopHeader();

  document.querySelectorAll(".event-tab").forEach((tab) => {
    tab.classList.toggle("active", tab.dataset.eventMode === eventMode);
  });

  if (activeView === "review" && reviewLoadMessage) {
    eventList.innerHTML = `
      <article class="event-card liquid-glass">
        <h2>Draft review unavailable</h2>
        <p>${escapeHtml(reviewLoadMessage)}</p>
      </article>
    `;
    return;
  }

  const orderedNodes = sortNodesNewestFirst(getCurrentListNodes());
  const nodeNoticeHTML = renderDataStatusNotice(nodeDataState);
  const upcomingNoticeHTML = renderDataStatusNotice(upcomingDataState);

  if (activeView === "discover") {
    renderDiscoverScreen();
  } else if (activeView === "profile") {
    renderProfileScreen();
  } else if (activeView === "settings") {
    renderSettingsScreen();
  } else if (activeView === "help") {
    renderHelpScreen();
  } else if (activeView === "inbox") {
    renderInboxScreen();
  } else if (activeView === "watchlist") {
    if (!watchlist.length) {
      renderWatchlistEmptyState(nodeNoticeHTML);
      return;
    }
    if (nodeDataState.status === "loading" && !orderedNodes.length) {
      eventList.innerHTML = nodeNoticeHTML;
      return;
    }
    const watchlistNodes = orderedNodes.filter((node) => getWatchlistHits(node).length);
    if (!watchlistNodes.length) {
      renderWatchlistNoMatches(nodeNoticeHTML);
      return;
    }
    renderNodeCards(watchlistNodes, { noticeHTML: nodeNoticeHTML });
  } else if (activeView === "saved") {
    if (nodeDataState.status === "loading" && !orderedNodes.length) {
      eventList.innerHTML = nodeNoticeHTML;
      return;
    }
    renderNodeCards(orderedNodes.filter((node) => savedNodeIds.includes(node.id)), {
      noticeHTML: nodeNoticeHTML,
      emptyTitle: "No saved nodes yet",
      emptyMessage: "Saved nodes will appear here."
    });
  } else if (activeView === "review") {
    if (reviewTab === "candidates") renderCandidateCards(eventCandidates);
    else renderNodeCards(orderedNodes);
  } else if (eventMode === "upcoming") {
    if (upcomingDataState.status === "loading" && !upcomingEvents.length) {
      eventList.innerHTML = upcomingNoticeHTML;
      return;
    }
    renderUpcomingCards(upcomingNoticeHTML);
  } else {
    if (nodeDataState.status === "loading" && !orderedNodes.length) {
      eventList.innerHTML = nodeNoticeHTML;
      return;
    }
    renderNodeCards(orderedNodes, { noticeHTML: nodeNoticeHTML });
  }
}

function section(title, body, open = false, extraClass = "") {
  return `
    <details class="detail-card liquid-glass ${escapeHtml(extraClass)}" ${open ? "open" : ""}>
      <summary>${escapeHtml(title)}</summary>
      <div class="detail-body">${body}</div>
    </details>
  `;
}

function hasValue(value) {
  return value !== undefined && value !== null && String(value).trim() !== "";
}

function formatDetailDateTime(dateString) {
  const date = new Date(dateString);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleString("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function cleanSourceLabel(source) {
  const label = String(source || "").trim();
  return label.toLowerCase() === "manual entry" ? "" : label;
}

function formatFactualValue(value) {
  if (!hasValue(value)) return "";
  if (typeof value === "number") return new Intl.NumberFormat("en-US").format(value);
  return String(value);
}

function detailRows(rows) {
  const visibleRows = rows.filter((row) => hasValue(row.value));
  if (!visibleRows.length) return "";

  return `
    <ul class="asset-list">
      ${visibleRows.map((row) => `
        <li class="asset-card">
          <div class="asset-top"><h3>${escapeHtml(row.label)}</h3></div>
          <p>${row.html || escapeHtml(formatFactualValue(row.value))}</p>
        </li>
      `).join("")}
    </ul>
  `;
}

function renderResearchEvidence(evidence) {
  if (!hasResearchEvidence(evidence)) return "";
  const sources = Array.isArray(evidence.sources) ? evidence.sources : [];
  const missingData = Array.isArray(evidence.missingData) ? evidence.missingData : [];
  const sourceCards = sources.map((source) => `
    <li class="asset-card evidence-source">
      <div class="evidence-head">
        <h3>${escapeHtml(source.sourceName)}</h3>
        <span class="status-pill status-${escapeHtml(source.status)}">${escapeHtml(formatLabel(source.status))}</span>
      </div>
      ${source.metadataOnly ? `<p class="evidence-note">Headlines are metadata only, not confirmed article research.</p>` : ""}
      ${source.facts?.length ? `
        <ul class="evidence-fact-list">
          ${source.facts.map((fact) => `<li>${escapeHtml(fact)}</li>`).join("")}
        </ul>
      ` : `<p>Source selected, but no compact observation was available.</p>`}
    </li>
  `).join("");
  const missingCard = missingData.length ? `
    <li class="asset-card evidence-source">
      <div class="evidence-head">
        <h3>Missing data / source warnings</h3>
        <span class="status-pill">Missing</span>
      </div>
      <ul class="evidence-fact-list">
        ${missingData.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
      </ul>
    </li>
  ` : "";

  return `
    <p class="research-evidence-note">API observations are supporting evidence. They do not automatically prove market impact; failed sources are missing data, not evidence.</p>
    <ul class="asset-list">
      ${sourceCards}
      ${missingCard}
    </ul>
  `;
}

function renderMissingDataReview(evidence) {
  const missingData = Array.isArray(evidence?.missingData) ? evidence.missingData : [];
  if (!missingData.length) return "";
  return `
    <ul class="asset-list">
      <li class="asset-card evidence-source">
        <div class="evidence-head">
          <h3>Missing data / source warnings</h3>
          <span class="status-pill">Review</span>
        </div>
        <ul class="evidence-fact-list">
          ${missingData.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
        </ul>
      </li>
    </ul>
  `;
}

function renderSourceReviewStatus(node, researchEvidence) {
  const sources = Array.isArray(node.sources)
    ? node.sources.map(cleanSourceLabel).filter(Boolean)
    : [];
  const sourceHTML = sources.length ? `
    <ul class="source-list">

        <li class="asset-card evidence-source">
          <div class="evidence-head">
            <h3>${escapeHtml(source)}</h3>
            <span class="status-pill">Source</span>
          </div>
        </li>

    </ul>
  ` : `<p>${node.isSupabaseNode ? "Source details not available for this node yet." : "Source details not available in this demo node."}</p>`;
  const statusHTML = detailRows([
    { label: "Data status", value: node.isSupabaseNode ? "Live data loaded" : "Demo fallback data" },
