}

  return "mixed";
}

function getNodeTimeValue(node) {
  return firstValue(node, ["published_at", "publishedAt"], firstValue(node, ["created_at", "createdAt"], ""));
}

function getNodeTimeMs(node) {
  const time = new Date(getNodeTimeValue(node)).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function sortNodesNewestFirst(list) {
  return list.slice().sort((a, b) => getNodeTimeMs(b) - getNodeTimeMs(a));
}

function formatTimeAgo(value) {
  // Card timestamps are calculated at render time from published_at, falling back to created_at.
  const time = new Date(value).getTime();
  if (Number.isNaN(time)) return "now";
  const minutes = Math.floor(Math.max(0, Date.now() - time) / 60000);
  if (minutes < 1) return "now";
  if (minutes < 60) return `${minutes} min`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} h`;
  return `${Math.floor(hours / 24)} d`;
}

function getNodeTimeLabel(node) {
  return formatTimeAgo(getNodeTimeValue(node));
}

function normalizeChain(item) {
  if (typeof item === "string") {
    return { title: item, event: item, mechanism: "", sectorImpact: "", assetImpact: "", watch: "" };
  }
  return {
    title: firstValue(item, ["title", "name", "chain_title"], "Causal chain"),
    event: firstValue(item, ["event", "trigger", "what_happened"], ""),
    mechanism: firstValue(item, ["mechanism", "why", "transmission"], ""),
    sectorImpact: firstValue(item, ["sectorImpact", "sector_impact", "impact"], ""),
    assetImpact: firstValue(item, ["assetImpact", "asset_impact", "assets"], ""),
    watch: firstValue(item, ["watch", "watchlist", "watch_for"], "")
  };
}

function normalizeScenario(item) {
  if (typeof item === "string") return { title: "Scenario", body: item };
  return {
    title: firstValue(item, ["title", "name", "scenario"], "Scenario"),
    body: firstValue(item, ["body", "description", "text", "summary"], "")
  };
}

function normalizeAsset(asset) {
  return {
    ticker: firstValue(asset, ["ticker", "symbol", "asset_ticker"], ""),
    name: firstValue(asset, ["name", "asset_name", "company"], ""),
    direction: normalizeDirection(firstValue(asset, ["direction", "impact_direction", "sentiment"], "mixed")),
    strength: firstValue(asset, ["strength", "impact_strength", "confidence"], "Watch"),
    reason: firstValue(asset, ["reason", "rationale", "summary", "description"], "")
  };
}

function relatedNodeId(row, allowOwnId = false) {
  const value = firstValue(row, ["node_id", "nodeId", "node", "clarifin_node_id", "parent_node_id"], allowOwnId ? firstValue(row, ["id"], "") : "");
  return value ? String(value) : "";
}

function groupByNodeId(rows, allowOwnId = false) {
  return rows.reduce((groups, row) => {
    const nodeId = relatedNodeId(row, allowOwnId);
    if (!nodeId) return groups;
    if (!groups[nodeId]) groups[nodeId] = [];
    groups[nodeId].push(row);
    return groups;
  }, {});
}

async function supabaseFetch(path) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: SUPABASE_HEADERS
  });
  if (!response.ok) {
    const body = await response.text();
    throw new Error(`Supabase request failed: ${response.status} ${body}`);
  }
  return response.json();
}

async function fetchRelatedRows(tableName, nodeIds) {
  if (!nodeIds.length) return [];
  const encodedIds = nodeIds.map((id) => encodeURIComponent(id)).join(",");
  for (const column of ["node_id", "nodeId", "node", "clarifin_node_id"]) {
    try {
      return await supabaseFetch(`${tableName}?select=*&${column}=in.(${encodedIds})`);
    } catch (error) {
      console.warn(`Clarifin Supabase: ${tableName} lookup by ${column} failed.`, error);
    }
  }
  try {
    const rows = await supabaseFetch(`${tableName}?select=*`);
    return rows.filter((row) => nodeIds.includes(relatedNodeId(row, tableName === "node_details")));
  } catch (error) {
    console.warn(`Clarifin Supabase: ${tableName} unavailable.`, error);
    return [];
  }
}

function convertSupabaseNode(row, assetRows, detailRows) {
  const detail = detailRows[0] || {};
  const title = firstValue(row, ["title", "headline", "name"], "Untitled node");
  const id = String(firstValue(row, ["id", "slug"], slugify(title)));
  const fallbackNode = fallbackNodes.find((node) => node.id === id || node.title === title) || fallbackNodes[0];
  const chains = toArray(firstValue(detail, ["chains", "causal_chain", "causal_chains", "causalChains"], firstValue(row, ["chains", "causal_chains"], []))).map(normalizeChain);
  const scenarios = toArray(firstValue(detail, ["scenarios"], firstValue(row, ["scenarios"], []))).map(normalizeScenario);
  const counterarguments = toArray(firstValue(detail, ["counterarguments", "counter_arguments", "counters"], firstValue(row, ["counterarguments", "counter_arguments"], []))).map((item) => typeof item === "string" ? item : firstValue(item, ["body", "text", "argument"], ""));
  const sources = toArray(firstValue(detail, ["sources"], firstValue(row, ["sources"], []))).map((item) => typeof item === "string" ? item : firstValue(item, ["name", "title", "url"], ""));

  return {
    id,
    category: firstValue(row, ["category", "topic", "type"], fallbackNode.category),
    title,
    short: firstValue(row, ["short", "summary", "subtitle", "description"], firstValue(detail, ["summary", "short"], fallbackNode.short)),
    impact: toNumber(firstValue(row, ["impact", "impact_score", "impactScore"], fallbackNode.impact), fallbackNode.impact),
    impactLabel: firstValue(row, ["impactLabel", "impact_label"], fallbackNode.impactLabel),
    confidence: toNumber(firstValue(row, ["confidence", "confidence_score", "confidenceScore"], fallbackNode.confidence), fallbackNode.confidence),
    confidenceLabel: firstValue(row, ["confidenceLabel", "confidence_label"], fallbackNode.confidenceLabel),
    region: firstValue(row, ["region", "market", "geography"], fallbackNode.region || "global"),
    published_at: firstValue(row, ["published_at", "publishedAt"], firstValue(row, ["created_at", "createdAt"], fallbackNode.published_at || fallbackNode.created_at || "")),
    created_at: firstValue(row, ["created_at", "createdAt"], fallbackNode.created_at || fallbackNode.published_at || ""),
    whyMatters: firstValue(detail, ["whyMatters", "why_matters", "why_it_matters"], firstValue(row, ["whyMatters", "why_matters", "why_it_matters"], fallbackNode.whyMatters)),
    chains: chains.length ? chains : fallbackNode.chains,
    affectedAssets: assetRows.length ? assetRows.map(normalizeAsset).filter((asset) => asset.ticker) : fallbackNode.affectedAssets,
    scenarios: scenarios.length ? scenarios : fallbackNode.scenarios,
    counterarguments: counterarguments.filter(Boolean).length ? counterarguments.filter(Boolean) : fallbackNode.counterarguments,
    sources: sources.filter(Boolean).length ? sources.filter(Boolean) : fallbackNode.sources
  };
}

async function loadPublishedNodes() {
  try {
    const publishedRows = await supabaseFetch("nodes?select=*&status=eq.published");
    if (!Array.isArray(publishedRows) || !publishedRows.length) {
      nodes = sortNodesNewestFirst(fallbackNodes);
      renderList();
      return;
    }

    const nodeIds = publishedRows
      .map((row) => firstValue(row, ["id", "slug"], ""))
      .filter(Boolean)
      .map(String);
    const [assetRows, detailRows] = await Promise.all([
      fetchRelatedRows("affected_assets", nodeIds),
      fetchRelatedRows("node_details", nodeIds)
    ]);
    const assetsByNode = groupByNodeId(assetRows);
    const detailsByNode = groupByNodeId(detailRows, true);
    nodes = sortNodesNewestFirst(publishedRows.map((row) => {
      const nodeId = String(firstValue(row, ["id", "slug"], ""));
      return convertSupabaseNode(row, assetsByNode[nodeId] || [], detailsByNode[nodeId] || []);
    }));

    if (selectedNodeId) {
      const selectedNode = getNode(selectedNodeId);
      selectedNode ? renderDetail(selectedNode) : renderList();
    } else {
      renderList();
    }
  } catch (error) {
    console.warn("Clarifin Supabase load failed. Using fallback demo data.", error);
    nodes = sortNodesNewestFirst(fallbackNodes);
    renderList();
  }
}

const listScreen = document.querySelector("#list-screen");
const detailScreen = document.querySelector("#detail-screen");
const screenIntro = document.querySelector("#screen-intro");
const eventTabs = document.querySelector("#event-tabs");
const eventList = document.querySelector("#event-list");
const detailSections = document.querySelector("#detail-sections");
const saveButton = document.querySelector("#save-node");
const bottomNav = document.querySelector(".bottom-nav");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getNode(id) {
  return nodes.find((node) => node.id === id);
}

function getTickers(node) {
  return node.affectedAssets
    .slice()
    .sort((a, b) => directionOrder[a.direction] - directionOrder[b.direction])
    .slice(0, 4)
    .map((asset) => ({ ticker: asset.ticker, direction: asset.direction }));
}

function getWatchlistHits(node) {
  const text = JSON.stringify(node).toLowerCase();
  return watchlist.filter((item) => text.includes(item.toLowerCase()));
}

function renderIntro() {
  if (activeView === "home") {
    screenIntro.innerHTML = `
      <p class="date-label">Wednesday, 21 May</p>
      <h1>Good morning, Luca</h1>
    `;
    eventTabs.hidden = false;
  } else if (activeView === "watchlist") {
    screenIntro.innerHTML = `
      <p class="date-label">Watchlist</p>
      <h1>Relevant nodes</h1>
    `;
    eventTabs.hidden = true;
  } else {
    screenIntro.innerHTML = `
      <p class="date-label">Saved</p>
      <h1>Saved nodes</h1>
    `;
    eventTabs.hidden = true;
  }
}

const REGION_FLAGS = {
  globe: "./globe.png",
  eu: "./eu.png",
  us: "./us.png"
};

function getRegionFlag(region) {
  const normalized = String(region || "").trim().toLowerCase();

  if (
    normalized === "us" ||
    normalized === "usa" ||
    normalized === "united states" ||
    normalized === "america" ||
    normalized === "united states of america"
  ) {
    return REGION_FLAGS.us;
  }

  if (
    normalized === "eu" ||
    normalized === "europe" ||
    normalized === "eurozone" ||
    normalized === "ecb" ||
    normalized === "european union"
  ) {
    return REGION_FLAGS.eu;
  }

  return REGION_FLAGS.globe;
}

function getUpcomingFlag(title) {
  const normalized = String(title || "").toLowerCase();
  if (normalized.includes("us") || normalized.includes("fed") || normalized.includes("nvidia")) return REGION_FLAGS.us;
  if (normalized.includes("ecb") || normalized.includes("europe")) return REGION_FLAGS.eu;
  return REGION_FLAGS.globe;
}

function renderNodeCards(list) {
  if (!list.length) {
    eventList.innerHTML = `<article class="event-card liquid-glass"><p>No nodes here yet.</p></article>`;
    return;
  }

  eventList.innerHTML = list
    .map(
      (node) => `
        <button class="event-card liquid-glass" data-node="${node.id}" type="button">
          <div class="card-header">
            <span class="category-pill">${escapeHtml(node.category)}</span>
            <img src="${getRegionFlag(node.region)}" class="region-flag" alt="Region" onerror="this.style.display='none'" />
          </div>
          <h2>${escapeHtml(node.title)}</h2>
          <p>${escapeHtml(node.short)}</p>
          <div class="card-meta">
            <span class="score-pill yellow">${node.impact}</span>
            <span class="score-pill gray">${node.confidence}</span>
          </div>
          <div class="ticker-row">
            ${getTickers(node).map((asset) => `<span class="ticker-chip ${asset.direction}">${escapeHtml(asset.ticker)}</span>`).join("")}
          </div>
          <span class="timestamp">${escapeHtml(getNodeTimeLabel(node))}</span>
        </button>
      `
    )
    .join("");
}

function renderUpcomingCards() {
  eventList.innerHTML = upcomingEvents
    .map(
      (event) => `
        <article class="event-card upcoming-card liquid-glass">
          <div class="card-header">
            <span class="category-pill">${escapeHtml(event.category)}</span>
            <img src="${getUpcomingFlag(event.title)}" class="region-flag" alt="Region" onerror="this.style.display='none'" />
          </div>
          <h2>${escapeHtml(event.title)}</h2>
          <p>${escapeHtml(event.short)}</p>
          <div class="ticker-row">
            ${event.watch.map((item) => `<span class="ticker-chip neutral">${escapeHtml(item)}</span>`).join("")}
          </div>
          <span class="timestamp">${escapeHtml(event.date)}</span>
        </article>
      `
    )
    .join("");
}

function renderList() {
  selectedNodeId = null;
  listScreen.hidden = false;
  detailScreen.hidden = true;
  bottomNav.hidden = false;
  window.scrollTo(0, 0);
  renderIntro();

  document.querySelectorAll(".event-tab").forEach((tab) => {
    tab.classList.toggle("active", tab.dataset.eventMode === eventMode);
  });

  const orderedNodes = sortNodesNewestFirst(nodes);

  if (activeView === "watchlist") {
    renderNodeCards(orderedNodes.filter((node) => getWatchlistHits(node).length));
  } else if (activeView === "saved") {
    renderNodeCards(orderedNodes.filter((node) => savedNodeIds.includes(node.id)));
  } else if (eventMode === "upcoming") {
    renderUpcomingCards();
  } else {
    renderNodeCards(orderedNodes);
  }
}

function section(title, body, open = false) {
  return `
    <details class="detail-card liquid-glass" ${open ? "open" : ""}>
      <summary>${escapeHtml(title)}</summary>
      <div class="detail-body">${body}</div>
    </details>
  `;
}

function renderDetail(node) {
  selectedNodeId = node.id;
  listScreen.hidden = true;
  detailScreen.hidden = false;
  bottomNav.hidden = true;
  window.scrollTo(0, 0);
  
  document.querySelector("#node-category").textContent = node.category;
  document.querySelector("#node-title").textContent = node.title;
  document.querySelector("#node-summary").textContent = node.short;
  
  document.querySelector("#impact-label").textContent = `Impact ${node.impact} / ${node.impactLabel}`;
  document.querySelector("#confidence-label").textContent = `Confidence ${node.confidence} / ${node.confidenceLabel}`;

  const isSaved = savedNodeIds.includes(node.id);
  saveButton.textContent = isSaved ? "Saved" : "Save";
  saveButton.classList.toggle("saved", isSaved);

  const chainsHTML = `<ul class="chain-list">${node.chains.map(c => `<li class="chain-step"><strong>${escapeHtml(c.title)}</strong><p>Event: ${escapeHtml(c.event)}</p><p>Impact: ${escapeHtml(c.sectorImpact)}</p></li>`).join("")}</ul>`;
  const assetsHTML = `<ul class="asset-list">${node.affectedAssets.map(a => `<li class="asset-card"><div class="asset-top"><h3>${escapeHtml(a.ticker)}</h3><span class="direction-${a.direction}">${escapeHtml(a.direction)}</span></div><p>${escapeHtml(a.reason)}</p></li>`).join("")}</ul>`;
  const scenariosHTML = `<ul class="scenario-list">${node.scenarios.map(s => `<li class="scenario-item"><strong>${escapeHtml(s.title)}:</strong><p>${escapeHtml(s.body)}</p></li>`).join("")}</ul>`;
  const countersHTML = `<ul class="counter-list">${node.counterarguments.map(c => `<li><p>${escapeHtml(c)}</p></li>`).join("")}</ul>`;

  detailSections.innerHTML = [
    section("Why it matters", `<p>${escapeHtml(node.whyMatters)}</p>`, true),
    section("Causal Chains", chainsHTML),
    section("Affected Assets", assetsHTML),
    section("Scenarios", scenariosHTML),
    section("Counterarguments", countersHTML),
    section("Sources", `<p>${node.sources.join(", ")}</p>`)
  ].join("");
}

eventList.addEventListener("click", (event) => {
  const card = event.target.closest(".event-card");
  if (!card || !card.dataset.node) return;
  renderDetail(getNode(card.dataset.node));
});

document.querySelector("#back-button").addEventListener("click", renderList);

saveButton.addEventListener("click", () => {
  if (!selectedNodeId) return;
  savedNodeIds = savedNodeIds.includes(selectedNodeId)
    ? savedNodeIds.filter((id) => id !== selectedNodeId)
    : [...savedNodeIds, selectedNodeId];
  localStorage.setItem("clarifinSavedNodes", JSON.stringify(savedNodeIds));
  renderDetail(getNode(selectedNodeId));
});

document.querySelectorAll(".event-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    eventMode = tab.dataset.eventMode;
    renderList();
  });
});

document.querySelectorAll(".nav-item").forEach((item) => {
  item.addEventListener("click", () => {
    activeView = item.dataset.view;
    eventMode = "top";
    document.querySelectorAll(".nav-item").forEach((nav) => nav.classList.toggle("active", nav === item));
    renderList();
  });
});

renderList();
loadPublishedNodes();

    </script>
  </body>
</html>
