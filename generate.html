<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clarifin Draft Generator</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", sans-serif;
        color: #111827;
        background: #f4f6f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 32px 16px;
      }

      main {
        width: min(100%, 720px);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      p {
        margin: 0 0 18px;
        color: #6b7280;
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 700;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 12px;
        font: inherit;
        color: #111827;
        background: #fff;
      }

      textarea {
        min-height: 180px;
        resize: vertical;
      }

      .hint {
        margin-top: 6px;
        font-size: 13px;
        color: #7d828a;
      }

      button {
        margin-top: 22px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 13px 16px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #111827;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .message {
        margin-top: 18px;
        padding: 14px;
        border-radius: 8px;
        display: none;
        line-height: 1.5;
      }

      .message.success {
        display: block;
        background: rgba(16, 185, 129, 0.12);
        color: #065f46;
      }

      .message.error {
        display: block;
        background: rgba(239, 68, 68, 0.12);
        color: #991b1b;
      }

      .message a {
        color: inherit;
        font-weight: 700;
      }

      .research-evidence {
        display: none;
        margin-top: 18px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
        background: #fff;
      }

      .research-evidence.visible {
        display: block;
      }

      .research-evidence h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .research-evidence-note,
      .evidence-warning {
        margin: 0 0 12px;
        color: #7d828a;
        font-size: 13px;
        line-height: 1.45;
      }

      .evidence-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 0;
        margin: 0;
      }

      .evidence-card {
        border-radius: 8px;
        background: #f4f6f8;
        padding: 12px;
      }

      .evidence-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 6px;
      }

      .evidence-head h3 {
        margin: 0;
        font-size: 14px;
      }

      .status-pill {
        padding: 3px 8px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        text-transform: capitalize;
        background: rgba(107, 114, 128, 0.12);
        color: #7e899a;
        white-space: nowrap;
      }

      .status-success {
        background: rgba(16, 185, 129, 0.12);
        color: #059669;
      }

      .status-partial_success {
        background: rgba(245, 158, 11, 0.15);
        color: #b45309;
      }

      .status-failed,
      .status-timeout,
      .status-rate_limited {
        background: rgba(239, 68, 68, 0.12);
        color: #dc2626;
      }

      .evidence-card ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .evidence-card li {
        color: #6b7280;
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Clarifin Draft Generator</h1>
      <p>Create a draft node from a raw market or macro event. Drafts are saved with <strong>status = draft</strong> and are not published automatically.</p>

      <form id="generator-form">
        <label for="raw_event_text">Raw event text</label>
        <textarea id="raw_event_text" name="raw_event_text" required placeholder="Example: US inflation came in hotter than expected, pushing bond yields higher..."></textarea>

        <label for="tickers">Optional tickers</label>
        <input id="tickers" name="tickers" placeholder="Example: SPY, QQQ, JPM" />
        <div class="hint">Separate tickers with commas.</div>

        <label for="source_urls">Optional source URLs</label>
        <input id="source_urls" name="source_urls" placeholder="Example: https://example.com/article" />
        <div class="hint">Separate URLs with commas. If empty, the draft will use “User provided event text” as source.</div>

        <button id="submit-button" type="submit">Generate Draft</button>
      </form>

      <div id="message" class="message"></div>
      <section id="research-evidence" class="research-evidence" aria-live="polite"></section>
    </main>

    <script>
      const SUPABASE_URL = "https://omoansqramrgtpecsudh.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_YXZ0BaSAQnCuOfohv7aGwQ_DZN4f8to";
      const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/generate-node`;
      const DASHBOARD_DRAFTS_URL = "https://supabase.com/dashboard/project/omoansqramrgtpecsudh/editor";

      const form = document.querySelector("#generator-form");
      const button = document.querySelector("#submit-button");
      const message = document.querySelector("#message");
      const researchEvidence = document.querySelector("#research-evidence");

      function splitOptionalList(value) {
        return value
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function showMessage(type, html) {
        message.className = `message ${type}`;
        message.innerHTML = html;
      }

      function hideResearchEvidence() {
        researchEvidence.className = "research-evidence";
        researchEvidence.innerHTML = "";
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function hasValue(value) {
        return value !== undefined && value !== null && String(value).trim() !== "";
      }

      function formatLabel(value) {
        return String(value || "")
          .replace(/_/g, " ")
          .trim()
          .replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function formatFactualValue(value) {
        if (!hasValue(value)) return "";
        if (typeof value === "number") return new Intl.NumberFormat("en-US").format(value);
        return String(value);
      }

      function normalizeObservationStatus(value) {
        const status = String(value || "skipped").trim().toLowerCase();
        const allowed = ["success", "partial_success", "skipped", "failed", "timeout", "rate_limited", "no_results"];
        return allowed.includes(status) ? status : "failed";
      }

      function aggregateObservationStatus(statuses) {
        const normalized = statuses.map(normalizeObservationStatus).filter(Boolean);
        if (!normalized.length) return "skipped";
        const unique = [...new Set(normalized)];
        if (unique.length === 1) return unique[0];
        if (unique.includes("success")) return "partial_success";
        if (unique.includes("rate_limited")) return "rate_limited";
        if (unique.includes("timeout")) return "timeout";
        if (unique.includes("failed")) return "failed";
        if (unique.includes("no_results")) return "no_results";
        return "skipped";
      }

      function compactObservationLabel(observation, facts) {
        const source = String(observation.source_name || "").toUpperCase();
        const query = String(observation.query_or_endpoint || "").trim();
        if (source === "FRED") return query || facts.series_name || "FRED series";
        if (source === "EIA") return query || facts.indicator_name || "EIA indicator";
        if (source === "ECB") return facts.indicator_name || query || "ECB series";
        if (source === "FMP") return facts.ticker || query || facts.company_name || "FMP";
        if (source === "GDELT") return "Query";
        return query || source || "Observation";
      }

      function compactObservationLine(observation) {
        const source = String(observation.source_name || "").toUpperCase();
        const status = normalizeObservationStatus(observation.status);
        const facts = observation.display_facts || {};
        const responseSummary = observation.response_summary || {};
        const warning = responseSummary.warning || observation.warning || "";

        if (source === "GDELT") {
          const query = facts.query || observation.query_or_endpoint || "";
          const count = facts.headline_count ?? "";
          if (status !== "success") return warning || "External headline support unavailable.";
          return `${query ? `Query: ${query}. ` : ""}${hasValue(count) ? `Headlines: ${count}. ` : ""}Headlines are metadata only.`;
        }

        if (status !== "success") {
          return warning || `${compactObservationLabel(observation, facts)} unavailable.`;
        }

        if (source === "FMP") {
          const parts = [
            facts.company_name,
            facts.sector,
            facts.industry,
            hasValue(facts.earnings_date) ? `earnings ${facts.earnings_date}` : "",
            hasValue(facts.eps_estimate) ? `EPS est. ${formatFactualValue(facts.eps_estimate)}` : "",
            hasValue(facts.revenue_estimate) ? `revenue est. ${formatFactualValue(facts.revenue_estimate)}` : "",
            hasValue(facts.market_cap) ? `market cap ${formatFactualValue(facts.market_cap)}` : ""
          ].filter(Boolean);
          return `${compactObservationLabel(observation, facts)}: ${parts.join(" - ") || "company context available"}`;
        }

        const label = compactObservationLabel(observation, facts);
        const latestValue = facts.latest_value ?? "";
        const latestDate = facts.latest_date || "";
        const unit = facts.unit || "";
        const change = facts.change_from_previous ?? "";
        const valueText = hasValue(latestValue) ? `${formatFactualValue(latestValue)}${unit ? ` ${unit}` : ""}` : "";
        const dateText = latestDate ? ` on ${latestDate}` : "";
        const changeText = hasValue(change) ? `; change ${formatFactualValue(change)}` : "";
        return `${label}: ${valueText || "latest value available"}${dateText}${changeText}`;
      }

      function renderResearchEvidence(result) {
        const observations = Array.isArray(result.external_data_observations_in_fact_pack)
          ? result.external_data_observations_in_fact_pack
          : [];
        const grouped = observations.reduce((groups, item) => {
          const sourceName = String(item.source_name || "").toUpperCase();
          if (!sourceName) return groups;
          if (!groups[sourceName]) groups[sourceName] = [];
          groups[sourceName].push(item);
          return groups;
        }, {});
        const sources = Object.entries(grouped).map(([sourceName, items]) => ({
          sourceName,
          status: aggregateObservationStatus(items.map((item) => item.status)),
          facts: items.map(compactObservationLine).filter(Boolean).slice(0, 5),
          metadataOnly: sourceName === "GDELT"
        }));
        const missingData = [
          ...(Array.isArray(result.missing_data_from_failed_sources) ? result.missing_data_from_failed_sources : []),
          ...(Array.isArray(result.source_warnings) ? result.source_warnings : [])
        ].map((item) => String(item || "").trim()).filter(Boolean).slice(0, 6);

        if (!sources.length && !missingData.length) {
          hideResearchEvidence();
          return;
        }

        researchEvidence.className = "research-evidence visible";
        researchEvidence.innerHTML = `
          <h2>Research Evidence</h2>
          <p class="research-evidence-note">API observations are supporting evidence. They do not automatically prove market impact; failed sources are missing data, not evidence.</p>
          <ul class="evidence-list">
            ${sources.map((source) => `
              <li class="evidence-card">
                <div class="evidence-head">
                  <h3>${escapeHtml(source.sourceName)}</h3>
                  <span class="status-pill status-${escapeHtml(source.status)}">${escapeHtml(formatLabel(source.status))}</span>
                </div>
                ${source.metadataOnly ? `<p class="evidence-warning">Headlines are metadata only, not confirmed article research.</p>` : ""}
                <ul>
                  ${source.facts.map((fact) => `<li>${escapeHtml(fact)}</li>`).join("")}
                </ul>
              </li>
            `).join("")}
            ${missingData.length ? `
              <li class="evidence-card">
                <div class="evidence-head">
                  <h3>Missing data / source warnings</h3>
                  <span class="status-pill">Missing</span>
                </div>
                <ul>
                  ${missingData.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
                </ul>
              </li>
            ` : ""}
          </ul>
        `;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Generating...";
        showMessage("success", "Generating draft. This can take a few seconds.");
        hideResearchEvidence();

        const formData = new FormData(form);
        const payload = {
          raw_event_text: String(formData.get("raw_event_text") || "").trim(),
          tickers: splitOptionalList(String(formData.get("tickers") || "")),
          source_urls: splitOptionalList(String(formData.get("source_urls") || "")),
        };

        try {
          const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: SUPABASE_PUBLISHABLE_KEY,
              Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            },
            body: JSON.stringify(payload),
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "The draft could not be generated.");
          }

          showMessage(
            "success",
            `Draft created successfully.<br><strong>Node ID:</strong> ${result.node_id}<br><br>Open Supabase Table Editor and check the <strong>nodes</strong> table for rows where <strong>status = draft</strong>.<br><a href="${DASHBOARD_DRAFTS_URL}" target="_blank" rel="noreferrer">Open Supabase Table Editor</a>`
          );
          renderResearchEvidence(result);
          form.reset();
        } catch (error) {
          hideResearchEvidence();
          showMessage("error", error.message || "Something went wrong.");
        } finally {
          button.disabled = false;
          button.textContent = "Generate Draft";
        }
      });
    </script>
  </body>
</html>
